<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire Sales Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F7F9FA;--sunk:#F1F4F6;--sand:#EBE0C4;--sand-soft:#F7F3EA;
  --ink:#003349;--ink-2:#2E5468;--ink-3:#587A91;--line:#E3E9ED;--line-2:#CBD6DD;
  --navy:#003349;--navy-2:#0B4560;--on-navy:#FFFFFF;--slate:#587A91;--slate-soft:#E8EEF2;
  --frost:#C6DCDA;--frost-soft:#E6EFEE;--orange:#FF5C39;--orange-ink:#B5401F;--orange-soft:#FFEDE7;
  --burg:#6F2C3F;--burg-soft:#F3E5E9;--sun:#D9C756;--sun-soft:#F6F1D2;--sun-ink:#62570F;
  --good:#2E6A4E;--good-soft:#E1EFE6;--band:#003349;--band-ink:#F8F7EE;--band-2:#587A91;
  --sh-1:0 1px 2px rgba(0,30,45,.04),0 8px 24px rgba(0,30,45,.06);--sh-2:0 24px 64px rgba(0,26,38,.22);
  --r-lg:18px;--r-md:12px;--r-sm:9px;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root[data-theme="dark-disabled"]{
  --bg:#0E1A20;--surface:#15242C;--surface-2:#192A33;--sunk:#111F26;--sand:#3A3424;--sand-soft:#252219;
  --ink:#E7EAE5;--ink-2:#AFB9BE;--ink-3:#7F8B91;--line:#243840;--line-2:#33494F;
  --navy:#8CC0D4;--navy-2:#A9D0DF;--on-navy:#04212E;--slate:#97B3C5;--slate-soft:#1F3440;
  --frost:#2C4D52;--frost-soft:#1A3238;--orange:#FF7052;--orange-ink:#FF9277;--orange-soft:#3B231C;
  --burg:#E3A6B6;--burg-soft:#3A2129;--sun:#D9C756;--sun-soft:#333015;--sun-ink:#E6D97E;
  --good:#8ACBA6;--good-soft:#1A3427;--band:#0A2E3F;--band-ink:#EEF1EA;--band-2:#97B3C5;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--sh-2:0 24px 64px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark-disabled"]{
  --bg:#0E1A20;--surface:#15242C;--surface-2:#192A33;--sunk:#111F26;--sand:#3A3424;--sand-soft:#252219;
  --ink:#E7EAE5;--ink-2:#AFB9BE;--ink-3:#7F8B91;--line:#243840;--line-2:#33494F;
  --navy:#8CC0D4;--navy-2:#A9D0DF;--on-navy:#04212E;--slate:#97B3C5;--slate-soft:#1F3440;
  --frost:#2C4D52;--frost-soft:#1A3238;--orange:#FF7052;--orange-ink:#FF9277;--orange-soft:#3B231C;
  --burg:#E3A6B6;--burg-soft:#3A2129;--sun:#D9C756;--sun-soft:#333015;--sun-ink:#E6D97E;
  --good:#8ACBA6;--good-soft:#1A3427;--band:#0A2E3F;--band-ink:#EEF1EA;--band-2:#97B3C5;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--sh-2:0 24px 64px rgba(0,0,0,.6);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
svg{flex:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.app.collapsed{grid-template-columns:76px minmax(0,1fr)}
.side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.brand{padding:26px 22px 20px}
.brand .w{font-family:"Josefin Sans",Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em;line-height:1;color:var(--navy);padding-top:3px}
.brand .s{font-size:13px;color:var(--slate);margin-top:6px;font-weight:500}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:3px}
.nav-sep{height:1px;background:var(--line);margin:10px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav a svg{width:20px;height:20px}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--navy);color:var(--on-navy);font-weight:600}
.nav a[aria-current="page"] svg{stroke-width:2.2}
.nav .badge{margin-left:auto;font-size:11.5px;border-radius:999px;padding:0 8px;font-weight:600;line-height:20px;background:var(--orange-soft);color:var(--orange-ink)}
.nav a[aria-current="page"] .badge{background:rgba(255,255,255,.18);color:var(--on-navy)}
.nav a.sig:not([aria-current="page"]) svg{color:var(--orange)}
.side-foot{margin-top:auto;padding:12px}
.collapse-btn{background:none;border:0;color:var(--ink-3);display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;width:100%;border-radius:12px;font-size:13px}
.collapse-btn:hover{background:var(--sunk)}
.collapse-btn svg{width:18px;height:18px}
.app.collapsed .lbl,.app.collapsed .brand .s,.app.collapsed .nav .badge{display:none}
.app.collapsed .brand{padding:26px 0 20px;text-align:center}
.app.collapsed .brand .w{font-size:0}.app.collapsed .brand .w::before{content:"E";font-size:22px}
.app.collapsed .nav a{justify-content:center}
.app.collapsed .collapse-btn{justify-content:center}.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.tabbar{display:none}

.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 32px;flex-wrap:wrap}
.search{position:relative;flex:1 1 260px;max-width:460px}
.search svg{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:14px}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);z-index:30;max-height:380px;overflow-y:auto;padding:6px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;font-size:14px;border-radius:9px}
.sres button:hover,.sres button:focus-visible{background:var(--sunk)}
.sres .k{font-size:12px;color:var(--ink-3);display:block}
.top .spacer{flex:1}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding:6px 12px;border-radius:999px;background:var(--sunk)}
.ctx svg{width:15px;height:15px}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.icon-btn{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:0 5px;line-height:17px}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:360px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);z-index:30;overflow:hidden}
.pop-h{padding:14px 16px 8px;font-weight:600;font-size:14px}
.pop button.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 16px;cursor:pointer;font-size:13px}
.pop button.item:hover{background:var(--sunk)}
.demo-note{margin:16px 32px 0;padding:10px 14px;border-radius:var(--r-md);color:var(--ink-2);font-size:13px;background:var(--sand-soft);display:flex;gap:12px;align-items:flex-start}
.demo-note:empty{display:none}
.demo-note .btn{margin-left:auto}
.content{padding:28px 32px 72px;max-width:1260px;width:100%;margin:0 auto}

/* headings */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.022em;margin:0;color:var(--navy)}
.ph h2{font-weight:650;font-size:22px;letter-spacing:-.015em;margin:0;color:var(--navy)}
.ph p{margin:8px 0 0;color:var(--ink-2);font-size:16px;max-width:720px}
.ph-sub{margin:4px 0 16px}.ph-sub p{font-size:14.5px;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--slate);letter-spacing:.01em}
.eyebrow svg{width:16px;height:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
.sec-h h2{font-size:24px;font-weight:700;letter-spacing:-.018em;margin:0;color:var(--ink)}
.sec-h p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}

/* hero + tiles */
.hero{margin:8px 0 28px}
.hero .date{font-size:14px;color:var(--slate);font-weight:600}
.hero h1{font-size:clamp(32px,4.4vw,48px);line-height:1.05;letter-spacing:-.03em;font-weight:700;margin:6px 0 10px;color:var(--navy)}
.hero p{font-size:18px;color:var(--ink-2);margin:0;max-width:760px}
.hero .sum{font-size:15px;color:var(--ink-3);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px 22px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--slate-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.tile .ic svg{width:22px;height:22px}
.tile.hot .ic{background:var(--orange-soft);color:var(--orange-ink)}
.tile .lab{font-size:14px;color:var(--ink-2);font-weight:600}
.tile .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .big small{font-size:15px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.tile .txt{font-size:14.5px;color:var(--ink-2);flex:1}
.tile .btn{align-self:flex-start;margin-top:8px}

/* insight cards */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.ins{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:box-shadow .2s,transform .2s}
.ins:hover{box-shadow:0 2px 4px rgba(0,30,45,.05),0 14px 34px rgba(0,30,45,.09)}
.ins.feature{grid-column:1/-1;padding:26px 28px}
.ins.feature h3{font-size:26px}
.ins-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate)}
.cat svg{width:16px;height:16px}
.ins h3{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.012em;font-weight:650}
.ins h3 button{all:unset;cursor:pointer}
.ins h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.ins h3 button:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.ins .co-line{font-size:13.5px;color:var(--ink-2)}
.ins .lede{margin:0;color:var(--ink-2);font-size:15px}
.ins .blk{font-size:14.5px}
.ins .blk b{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:1px}
.ins-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.ins-foot .src{font-size:12.5px;color:var(--ink-3);flex:1;min-width:160px}
.facts2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;margin:2px 0 0;font-size:14px}
.facts2 dt{color:var(--ink-3);font-size:13px}.facts2 dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.use{background:var(--sunk);border-radius:var(--r-md);padding:10px 14px;font-size:14px}
details.use summary{cursor:pointer;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px;list-style:none}
details.use summary::-webkit-details-marker{display:none}
details.use summary svg{width:17px;height:17px}
details.use[open] summary{margin-bottom:8px}
details.use dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0}
details.use dt{color:var(--ink-3);font-size:13px}details.use dd{margin:0}
@media (max-width:560px){.facts2,details.use dl{grid-template-columns:1fr}}

/* next appointment */
.nextappt{background:var(--surface);border-radius:22px;box-shadow:var(--sh-1);border:1px solid var(--line);padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:28px;align-items:center}
@media (max-width:760px){.nextappt{grid-template-columns:minmax(0,1fr);padding:22px}}
.nextappt h2{font-size:30px;letter-spacing:-.02em;margin:6px 0 4px;color:var(--navy);line-height:1.15}
.nextappt .when{font-size:16px;color:var(--ink-2)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.fact{font-size:13.5px;background:var(--sunk);border-radius:999px;padding:5px 12px;color:var(--ink)}
.nextappt .brief-s{font-size:15px;color:var(--ink-2);margin:0 0 16px;max-width:720px}
.na-prog{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:var(--sunk)}.ring .val{stroke:var(--navy);stroke-linecap:round;transition:stroke-dashoffset .6s ease}

/* secret shopper band */
.band{background:var(--band);color:var(--band-ink);border-radius:22px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:16px}
@media (max-width:860px){.band{grid-template-columns:minmax(0,1fr)}}
.band .eyebrow{color:var(--band-2)}
.band h2{font-size:28px;letter-spacing:-.02em;margin:6px 0 6px;line-height:1.15;color:var(--band-ink)}
.band p{margin:0;color:var(--band-ink);opacity:.85;font-size:15px}
.band .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.light{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.btn.ghost-l{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35)}
.btn.ghost-l:hover{border-color:var(--band-ink)}

/* generic surfaces */
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);min-width:0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.panel-h h2{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.panel-h .sub{font-size:13px;color:var(--ink-3);font-weight:400}
.panel-b{padding:16px 20px}
.empty{padding:32px 20px;text-align:center;color:var(--ink-2);font-size:14.5px}
.empty .btn{margin-top:12px}
.row-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 20px;border-top:1px solid var(--line)}
.panel-h+.row-item,.row-item:first-child{border-top:0}
.ri-t{font-weight:600}
.ri-meta{font-size:13px;color:var(--ink-2);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ri-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.chg{font-variant-numeric:tabular-nums;margin-top:2px}
.chg .prev{color:var(--ink-3);text-decoration:line-through}
.why{font-size:14px;color:var(--ink-2);margin-top:3px}
@media (max-width:700px){.row-item{grid-template-columns:minmax(0,1fr)}.ri-acts{justify-content:flex-start}}

/* status atoms */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:22px;padding:0 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;background:none;font-family:inherit}
button.pill{cursor:pointer}button.pill:hover{filter:brightness(.97);text-decoration:underline;text-underline-offset:2px}
.f-current{background:var(--good-soft);color:var(--good)}
.f-review{background:var(--sun-soft);color:var(--sun-ink)}
.f-stale{border:1px dashed var(--ink-3);color:var(--ink-2)}
.f-expired{background:var(--burg-soft);color:var(--burg)}
.f-conflict{background:var(--orange);color:#fff}
.f-unverified{border-color:var(--line-2);color:var(--ink-2)}
.f-rejected,.f-superseded{color:var(--ink-3);border-color:var(--line)}
.vs-Verified{border-color:var(--good);color:var(--good)}
.vs-Pending{border-color:var(--sun);color:var(--sun-ink)}
.vs-More{border-color:var(--orange);color:var(--orange-ink)}
.vs-Rejected{border-color:var(--burg);color:var(--burg)}
.chip{font-size:11px;padding:0 7px;border-radius:999px;line-height:18px;font-weight:600;white-space:nowrap;display:inline-block;vertical-align:2px;margin-left:4px}
.chip.demo{border:1px dashed var(--ink-3);color:var(--ink-2)}
.chip.cand{background:var(--slate-soft);color:var(--slate)}
.chip.arch{border:1px solid var(--line-2);color:var(--ink-3)}
.flag{display:inline-block;font-size:12px;color:var(--orange-ink);background:var(--orange-soft);border-radius:999px;padding:0 9px;line-height:20px;margin-top:4px;white-space:nowrap}
.conf{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;background:none;border:0;padding:2px 4px;border-radius:6px;font-family:inherit}
button.conf{cursor:pointer}button.conf:hover{background:var(--sunk)}
.conf i{display:inline-flex;gap:2px;font-style:normal}
.conf i b{width:4px;height:12px;background:var(--line-2);border-radius:2px}
.conf i b.on{background:var(--navy)}
.score{font-size:12px;font-weight:650;line-height:22px;padding:0 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;flex:none;display:inline-block}
.score.s5{background:var(--orange);color:#fff}.score.s4{background:var(--sun-soft);color:var(--sun-ink);border-color:var(--sun)}.score.s3{border-color:var(--sun);color:var(--sun-ink)}.score.s2,.score.s1{border-color:var(--line-2);color:var(--ink-3)}.score.opp{background:var(--good-soft);color:var(--good)}

.ev{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:1px 0 1px 9px;border-left:3px solid var(--line-2);min-width:96px;margin:2px 0;border-radius:1px}
.ev:hover .val{text-decoration:underline}
.ev:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ev .val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.ev .lbl2{color:var(--ink-2);font-size:12px;margin-right:4px}
.ev .m{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.ev[data-f="current"]{border-left-color:var(--good)}
.ev[data-f="review"]{border-left-color:var(--sun)}
.ev[data-f="stale"]{border-left-style:dashed;border-left-color:var(--ink-3)}
.ev[data-f="expired"]{border-left-color:var(--burg)}
.ev[data-f="conflict"]{border-left-color:var(--orange)}
.ev[data-f="unverified"]{border-left-style:dotted;border-left-color:var(--ink-3)}
.nv{color:var(--ink-3);font-style:italic;font-size:13px;white-space:nowrap}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface-2)}
.t tr.base td{background:var(--slate-soft)}
.t tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
.t .r{text-align:right}.t .nw{white-space:nowrap}
.t td.cb,.t th.cb{width:36px;padding-right:0}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap;line-height:1.3;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.pri:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn.lg{padding:11px 22px;font-size:15px}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.link{border-color:transparent;background:none;padding:4px 8px;color:var(--navy)}
.btn.link:hover{text-decoration:underline}
.btn.warn{color:var(--burg);border-color:var(--burg-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.in{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;min-height:38px;max-width:100%}
textarea.in{min-height:90px;resize:vertical;width:100%;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.field .in{width:100%}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--orange-ink)}
.field .err:empty{display:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.span2{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink)}
.checks label{display:inline-flex;gap:6px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .in{min-height:36px;padding:6px 12px;border-radius:999px}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg{display:inline-flex;border-radius:999px;background:var(--sunk);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;font-size:13.5px;cursor:pointer;border-radius:999px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,30,45,.12);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy);font-weight:650}
.tabs .n{font-size:12px;color:var(--ink-3);margin-left:5px}
.qtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:4px 0 18px}
.qtabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.qtabs button svg{width:17px;height:17px}
.qtabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.qtabs .n{font-size:12px;opacity:.75}

.dl{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;font-size:14px;margin:0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:13.5px}
.bar-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--slate);border-radius:999px}
.bar-row .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kstrip>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kstrip .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.kstrip .k{font-size:12.5px;color:var(--ink-2)}
details.more{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
details.more>summary{cursor:pointer;padding:14px 20px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}

details.more>summary svg{width:16px;height:16px;transition:transform .2s}
details.more[open]>summary svg{transform:rotate(90deg)}
details.more>.inner{border-top:1px solid var(--line)}

/* appointments */
.alist{display:flex;flex-direction:column;gap:12px}
.appt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 20px;display:grid;grid-template-columns:92px minmax(0,1fr) 170px auto;gap:18px;align-items:center}
@media (max-width:900px){.appt{grid-template-columns:72px minmax(0,1fr)}.appt .prep,.appt .acts{grid-column:2}}
.appt .when{border-right:1px solid var(--line);padding-right:14px}

.appt h3 button:focus-visible{outline:2px solid var(--orange)}
.appt .meta{font-size:13.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:4px 12px;flex-wrap:wrap}
.appt .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--navy);border-radius:999px;transition:width .5s ease}
.prep .pl{font-size:12.5px;color:var(--ink-2);margin-top:5px}

/* steps (guided prep, how it works) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:22px}
.step::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .sn{width:40px;height:40px;border-radius:50%;background:var(--slate-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.step.done .sn{background:var(--navy);color:var(--on-navy)}
.step .sn svg{width:18px;height:18px}
.step h3{margin:7px 0 6px;font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step h4{margin:12px 0 4px;font-size:13px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step ul{margin:0;padding-left:18px;font-size:14.5px}.step li{margin:4px 0}
.step .done-t{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);margin-top:10px;cursor:pointer;background:var(--sunk);padding:6px 12px;border-radius:999px}

.how3 .hs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;position:relative}
.how3 .hs .ic{width:40px;height:40px;border-radius:12px;background:var(--slate-soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
.how3 .hs .ic svg{width:21px;height:21px}
.how3 .hs .k{font-size:12.5px;color:var(--slate);font-weight:600;margin-top:12px}
.how3 .hs h3{margin:2px 0 6px;font-size:17px}
.how3 .hs p{margin:0;font-size:14px;color:var(--ink-2)}
@media (min-width:821px){.how3 .hs:not(:last-child)::after{content:"";position:absolute;right:-13px;top:38px;width:10px;height:10px;border-top:2px solid var(--line-2);border-right:2px solid var(--line-2);transform:rotate(45deg);background:none}}
.ss-hero{background:var(--sand-soft);border-radius:24px;padding:30px 32px;margin-bottom:6px}
.ss-hero h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.08;margin:8px 0 10px;color:var(--navy)}
.ss-hero p{font-size:16.5px;color:var(--ink-2);margin:0 0 18px;max-width:780px}
.ss-hero .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* compare cards */
.cmp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:12px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cc.is-base{border:2px solid var(--navy)}
.cc .tagl{font-size:12.5px;font-weight:650;color:var(--slate);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cc.is-base .tagl{color:var(--navy)}
.cc h3{margin:0;font-size:19px;letter-spacing:-.01em}
.cc .price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hbar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--slate);border-radius:999px}
.cc.is-base .hbar span{background:var(--navy)}
.cc dl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:5px 10px;margin:6px 0 0;font-size:13.5px}
.cc dt{color:var(--ink-3);font-size:12.5px}.cc dd{margin:0;min-width:0}
.diffs{list-style:none;margin:4px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.diffs li{display:flex;gap:6px}.diffs .plus{color:var(--good);font-weight:700}.diffs .minus{color:var(--orange-ink);font-weight:700}
.cc .foot{font-size:12.5px;color:var(--ink-3);margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

/* competitor cards */
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s}
.co:hover{box-shadow:0 2px 4px rgba(0,30,45,.05),0 14px 34px rgba(0,30,45,.09)}
.co h3{margin:0;font-size:18px;letter-spacing:-.01em}
.co .sub2{font-size:13.5px;color:var(--ink-2)}
.co .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.co .stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.co .stats span{font-size:12px;color:var(--ink-3)}
.co .health{display:flex;gap:5px;flex-wrap:wrap}
.co .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* drawers + modals */
.scrim{position:fixed;inset:0;background:rgba(0,20,30,.32);z-index:40;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--surface);z-index:41;box-shadow:var(--sh-2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s cubic-bezier(.2,.8,.2,1);border-radius:22px 0 0 22px}

.dh{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}

.dh .s{font-size:13.5px;color:var(--ink-2);margin-top:5px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.db{overflow-y:auto;padding:20px 24px 28px;flex:1}

.sec{margin-top:24px}.sec:first-child{margin-top:0}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 48px);background:var(--surface);z-index:51;border-radius:22px;box-shadow:var(--sh-2);display:flex;flex-direction:column}

.delta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r-md);padding:14px 16px}

.delta b{font-size:18px;font-variant-numeric:tabular-nums}
.delta .old b{color:var(--ink-3);text-decoration:line-through;font-weight:600}
.delta .arr{color:var(--ink-3);font-size:20px}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip{position:fixed;z-index:70;width:300px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:14px 16px;font-size:13.5px;animation:fade .15s ease-out}
.tip.up{transform:translateY(-100%)}
.tip .tip-h{font-weight:650;font-size:14px;margin-bottom:4px}
.tip p{margin:0 0 8px}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}

.brief ul{margin:0;padding-left:18px}.brief li{margin:5px 0}
.tag{font-size:11px;font-weight:600;padding:0 8px;border-radius:999px;line-height:18px;white-space:nowrap}
.tag.st{background:var(--slate-soft);color:var(--slate)}
.tag.rec{border:1px solid var(--sun);color:var(--sun-ink)}
.tag.vf{border:1px solid var(--good);color:var(--good)}

.srcref{font-size:12px}

.srcref button:focus-visible{outline:2px solid var(--orange)}
.check{display:flex;gap:9px;align-items:center;font-size:14px;padding:4px 0}
.integ{display:grid;grid-template-columns:minmax(0,220px) 140px minmax(0,1fr);gap:4px 18px;padding:16px 20px;border-top:1px solid var(--line);align-items:start;font-size:14px}

@media (max-width:760px){.integ{grid-template-columns:minmax(0,1fr)}}
.st-Connected{border-color:var(--good);color:var(--good)}

.st-Demo{border:1px dashed var(--ink-3);color:var(--ink-2)}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:var(--sh-2);max-width:400px;animation:fade .2s ease-out}
.toast.err{box-shadow:inset 4px 0 0 var(--orange),var(--sh-2)}

/* secret shopper alert cards */
.ss-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px 22px;margin-bottom:14px}
.ss-card.s5{border-left-color:var(--orange)}.ss-card.s4{border-left-color:var(--sun)}.ss-card.opp{border-left-color:var(--good)}
.ss-head{display:flex;gap:10px;align-items:flex-start}
.ss-head h3{margin:0;font-size:17px;font-weight:650;line-height:1.35}
.ss-dl{display:grid;grid-template-columns:160px minmax(0,1fr);gap:7px 16px;margin:14px 0 0;font-size:14px}.ss-dl dt{color:var(--ink-3)}.ss-dl dd{margin:0}

.ss-banner{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:13.5px;background:var(--orange-soft);color:var(--orange-ink)}

.ss-meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2);margin-top:12px}
.ss-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
details.how{margin-top:10px;font-size:13px;color:var(--ink-2)}details.how summary{cursor:pointer;color:var(--ink-3)}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:520px}
.mini3>div{background:var(--sunk);border-radius:var(--r-md);padding:12px 14px}.mini3 .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.mini3 .k{font-size:12.5px;color:var(--ink-2)}
.bc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;margin-top:4px}.bc-grid .sec{margin-top:22px}
@media (max-width:900px){.bc-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- lookups ---------- */
const compById=id=>S.competitors.find(c=>c.id===id);
const prodById=id=>S.products.find(p=>p.id===id);
const obsById=id=>S.obs.find(o=>o.id===id);
const apptById=id=>S.appts.find(a=>a.id===id);
const compArch=id=>{const c=compById(id);return !c||c.archived};
const subj=o=>{const c=compById(o.compId),p=o.prodId?prodById(o.prodId):null;return (c?c.name:'Unknown')+(p?', '+p.name:'')};
const isChange=o=>o.verification!=='Rejected'&&(!!o.prev||['launch','floorplan','inventory'].includes(o.category));
const byObsDesc=(a,b)=>b.observed.localeCompare(a.observed)||b.id.localeCompare(a.id);

/* ---------- conflict / supersede engine ---------- */
const norm=o=>o.amount!=null&&o.category!=='deposit'?String(o.amount):String(o.value).toLowerCase().replace(/[^a-z0-9$%.]/g,'');
function cx(){
  if(_cx)return _cx;
  const groups={},conflict={},superseded=new Set(),live={};
  for(const o of S.obs){if(o.verification==='Rejected'||MULTI.has(o.field))continue;const k=(o.prodId||o.compId)+'|'+o.field;(groups[k]=groups[k]||[]).push(o)}
  for(const k in groups){
    const g=groups[k].slice().sort(byObsDesc);
    const ver=g.filter(o=>o.verification==='Verified');const lv=ver[0]||null;
    ver.slice(1).forEach(o=>superseded.add(o.id));
    g.filter(o=>o.verification!=='Verified'&&lv&&o.observed<lv.observed).forEach(o=>superseded.add(o.id));
    const L=(lv?[lv]:[]).concat(g.filter(o=>o.verification!=='Verified'&&(!lv||o.observed>=lv.observed)));
    live[k]=L;
    if(new Set(L.map(norm)).size>1)L.forEach(o=>{conflict[o.id]=L.filter(x=>norm(x)!==norm(o)).map(x=>x.id)});
  }
  return _cx={conflict,superseded,live};
}
function best(key,field){const L=cx().live[key+'|'+field];if(!L||!L.length)return null;return L.find(o=>o.verification==='Verified')||L[0]}
function liveMulti(key,fields){return S.obs.filter(o=>(o.prodId||o.compId)===key&&fields.includes(o.field)&&o.verification!=='Rejected'&&!cx().superseded.has(o.id)).sort(byObsDesc)}

/* ---------- confidence (explainable) and freshness (separate) ---------- */
function confidence(o){
  const off=OFFICIAL.includes(o.sourceType);
  if(!o.sourceRef)return {level:'Low',why:'No source or evidence reference attached'};
  if(off&&o.verification==='Verified')return {level:'High',why:SRC[o.sourceType]+', reviewed by '+(o.reviewer||'a reviewer')};
  if(off)return {level:'Medium',why:SRC[o.sourceType]+', awaiting review'};
  if(o.sourceType==='third_party')return o.verification==='Verified'?{level:'Medium',why:'Third-party listing checked against other evidence'}:{level:'Low',why:'Third-party listing, not corroborated'};
  const n=1+(o.corroborations||0),kind=o.sourceType==='buyer_report'?'buyer report':'sales observation';
  if(n>=2)return {level:'Medium',why:n+' consistent '+kind+'s'};
  return {level:'Low',why:'Single '+kind+', not corroborated'};
}
function freshness(o){
  const c=cx();
  if(o.verification==='Rejected')return {k:'rejected',label:'Rejected',why:'Rejected by a reviewer'};
  if(c.superseded.has(o.id))return {k:'superseded',label:'Superseded',why:'A newer verified observation replaced this one'};
  if(c.conflict[o.id])return {k:'conflict',label:'Conflicting',why:'Disagrees with '+c.conflict[o.id].map(id=>{const x=obsById(id);return x?x.value+' ('+SRC[x.sourceType].toLowerCase()+')':id}).join(', ')};
  if(o.verification!=='Verified')return {k:'unverified',label:'Unverified',why:o.verification==='More info required'?'Waiting on more evidence':'Not reviewed yet'};
  if(o.expires&&until(o.expires)<0)return {k:'expired',label:'Expired',why:'Advertised end date passed ('+fmtD(o.expires)+')'};
  if(o.revalidateBy&&until(o.revalidateBy)<0)return {k:'expired',label:'Expired',why:'Revalidation was due '+fmtD(o.revalidateBy)};
  if(o.markedStale)return {k:'stale',label:'Outdated',why:'Marked outdated by a reviewer'};
  const a=ago(o.observed);
  if(a>45)return {k:'stale',label:'Outdated',why:'Last observed '+a+' days ago'};
  if(a>21||(o.revalidateBy&&until(o.revalidateBy)<=7))return {k:'review',label:'Needs review',why:o.revalidateBy&&until(o.revalidateBy)<=7?'Revalidation due '+fmtD(o.revalidateBy):'Observed '+a+' days ago'};
  return {k:'current',label:'Current',why:'Observed '+rel(o.observed)+(o.revalidateBy?'; revalidate by '+fmtD(o.revalidateBy):'')};
}
const quotable=o=>!!o&&o.verification==='Verified'&&['current','review'].includes(freshness(o).k);

const confHTML=o=>{const c=confidence(o),n={High:3,Medium:2,Low:1}[c.level],inner=`<i aria-hidden="true">${[1,2,3].map(i=>`<b class="${i<=n?'on':''}"></b>`).join('')}</i>${c.level}`;return o.id?`<button type="button" class="conf" data-a="why" data-k="conf" data-id="${o.id}" aria-label="Confidence ${c.level}. Explain" title="${esc(c.why)}">${inner}</button>`:`<span class="conf" title="${esc(c.why)}">${inner}</span>`};
const freshHTML=o=>{const f=freshness(o);return `<button type="button" class="pill f-${f.k}" data-a="why" data-k="fresh" data-id="${o.id}" aria-label="Freshness ${f.label}. Explain" title="${esc(f.why)}">${f.label}</button>`};

/* ---------- derived sets ---------- */
function visibleAppts(){const r=me();if(r.customers==='none')return [];if(r.customers==='own')return S.appts.filter(a=>a.consultant===r.name);return S.appts}
function kpis(){
  const act=S.competitors.filter(c=>!c.archived),live=S.obs.filter(o=>!compArch(o.compId));
  return {
    builders:new Set(act.map(c=>c.name.trim().toLowerCase())).size,
    comms:new Set(act.map(c=>c.community.trim().toLowerCase())).size,
    verified:live.filter(o=>o.verification==='Verified'&&!cx().superseded.has(o.id)).length,
    changes:live.filter(o=>isChange(o)&&ago(o.observed)<=30&&ago(o.observed)>=0).length,
    appts:visibleAppts().filter(a=>a.date>=TODAY&&!['Cancelled','Completed'].includes(a.status)).length,
    needs:live.filter(o=>['unverified','conflict','expired'].includes(freshness(o).k)).length
  };
}
function attention(){
  const items=[];
  for(const o of S.obs){
    if(compArch(o.compId))continue;const f=freshness(o);
    if(f.k==='expired')items.push({kind:'Expired',cls:'f-expired',o,text:f.why});
    else if(f.k==='conflict')items.push({kind:'Conflicting',cls:'f-conflict',o,text:f.why});
    else if(f.k==='unverified'&&!OFFICIAL.includes(o.sourceType))items.push({kind:'Unverified report',cls:'f-unverified',o,text:SRC[o.sourceType]+', '+rel(o.observed)});
    else if(f.k==='stale')items.push({kind:'Outdated',cls:'f-stale',o,text:f.why});
    if(!o.sourceRef&&o.verification!=='Rejected')items.push({kind:'Missing source',cls:'f-stale',o,text:'No evidence reference attached'});
    if(o.expires&&o.verification==='Verified'&&f.k!=='expired'&&until(o.expires)<=7)items.push({kind:'Promotion ending',cls:'f-review',o,text:'Advertised to end '+fmtD(o.expires)+' ('+rel(o.expires)+')'});
  }
  const order={Conflicting:0,Expired:1,'Promotion ending':2,'Missing source':3,'Unverified report':4,Outdated:5};
  return items.sort((a,b)=>order[a.kind]-order[b.kind]);
}
function recs(){
  const out=[],seen=new Set(),c=cx();
  for(const o of S.obs){
    if(compArch(o.compId)||!c.conflict[o.id])continue;const key=(o.prodId||o.compId)+'|'+o.field;if(seen.has(key))continue;seen.add(key);
    const g=c.live[key]||[o];
    out.push({p:1,title:'Resolve conflicting '+o.field.toLowerCase()+' reports for '+subj(o),why:g.map(x=>x.value+' ('+SRC[x.sourceType].toLowerCase()+', '+x.verification.toLowerCase()+')').join(' vs '),ids:g.map(x=>x.id),a:'goVer',tab:'conflicts',label:'Open conflicts'});
  }
  for(const a of visibleAppts()){const d=until(a.date);if(d>=0&&d<=2&&!a.briefing&&!['Cancelled','Completed'].includes(a.status))out.push({p:2,title:'Prepare a briefing for '+a.customer,why:'Appointment '+(d===0?'today':d===1?'tomorrow':fmtD(a.date))+' at '+fmtT(a.time)+' with no briefing generated',a:'openAppt',id:a.id,label:'Open appointment'})}
  for(const it of attention()){
    if(it.kind==='Promotion ending')out.push({p:3,title:'Check whether '+subj(it.o)+' extends its '+it.o.field.toLowerCase()+' offer',why:it.text+'. It drops out of briefings after that date.',ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
    if(it.kind==='Expired')out.push({p:4,title:'Revalidate '+it.o.field.toLowerCase()+' for '+subj(it.o),why:it.text,ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
    if(it.kind==='Outdated'&&it.o.category==='price')out.push({p:4,title:'Refresh the starting price for '+subj(it.o),why:it.text+'. Excluded from briefings until refreshed.',ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
  }
  for(const o of S.obs){if(!compArch(o.compId)&&o.verification==='Pending review'&&OFFICIAL.includes(o.sourceType)&&!c.conflict[o.id])out.push({p:3,title:'Verify '+o.field.toLowerCase()+': '+subj(o),why:SRC[o.sourceType]+' observation from '+rel(o.observed)+' is awaiting review',ids:[o.id],a:'openObs',id:o.id,label:'Review evidence'})}
  return out.sort((a,b)=>a.p-b.p).slice(0,6);
}

const dayLabel=d=>d===TODAY?'Today':d===dOff(1)?'Tomorrow':fmtD(d);
function mismatch(base,p){const m=[];if(base.type!==p.type)m.push(p.type+' vs '+base.type);if(Math.abs(base.lot-p.lot)>=5)m.push(p.lot+'′ vs '+base.lot+'′ lot');return m}
function cmpData(){
  const C=UI.cmp,base=S.empire.find(p=>p.id===C.base)||S.empire[0];
  let rows=[];
  for(const c of S.competitors){if(c.archived||(C.comp!=='all'&&c.id!==C.comp))continue;const ps=S.products.filter(p=>p.compId===c.id);if(!ps.length){if(C.showCand&&C.type==='all'&&C.minConf==='any'&&!C.hideUnlike)rows.push({c,p:null});continue}ps.forEach(p=>rows.push({c,p}))}
  rows=rows.filter(r=>{if(!r.p)return true;if(C.type!=='all'&&r.p.type!==C.type)return false;if(C.hideUnlike&&mismatch(base,r.p).length)return false;
    if(C.minConf!=='any'){const po=best(r.p.id,'Starting price');if(!po)return false;const lv=confidence(po).level;if(C.minConf==='High'&&lv!=='High')return false;if(C.minConf==='Medium'&&lv==='Low')return false}return true});
  const price=r=>{const o=r.p&&best(r.p.id,'Starting price');return o&&o.amount!=null?o.amount:Infinity};
  const lastV=r=>r.p?(S.obs.filter(o=>o.prodId===r.p.id&&o.verifiedOn).map(o=>o.verifiedOn).sort().pop()||''):'';
  const sorters={price:(a,b)=>price(a)-price(b),sqft:(a,b)=>((b.p&&b.p.sqft)||0)-((a.p&&a.p.sqft)||0),lot:(a,b)=>Math.abs(((a.p&&a.p.lot)||999)-base.lot)-Math.abs(((b.p&&b.p.lot)||999)-base.lot),verified:(a,b)=>lastV(b).localeCompare(lastV(a))};
  rows.sort((a,b)=>((!!b.p)-(!!a.p))||sorters[C.sort](a,b));
  return {base,rows,lastV};
}

const SEASON={winter:0,spring:1,summer:2,fall:3,autumn:3};
function occIdx(s){const m=String(s||'').toLowerCase().match(/(winter|spring|summer|fall|autumn)\s+(\d{4})/);return m?+m[2]*4+SEASON[m[1]]:null}

const KW={price:/price|square|sq ft|afford|budget/i,incentive:/decor|incentive|upgrade|appliance|closing|offer/i,financing:/mortgage|rate|payment|financ/i,deposit:/deposit/i,timing:/move|occupan|timing|90 days|soon/i};
function eventKW(ev){const f=ev.o.field,c=ev.o.category;if(c==='price')return [KW.price];if(f==='Mortgage promotion')return [KW.financing,KW.price];if(f==='Closing costs')return [KW.incentive,KW.financing];if(c==='incentive')return [KW.incentive];if(c==='deposit')return [KW.deposit];if(c==='occupancy'||c==='inventory')return [KW.timing];return []}
function canSee(x){const r=me();if(r.customers==='none')return false;if(r.customers==='own')return x.consultant===r.name;return true}
function allProspects(){
  return S.appts.filter(a=>a.status!=='Cancelled').map(a=>({id:a.id,name:a.customer,consultant:a.consultant,prefType:a.prefType,budgetMin:a.budgetMin,budgetMax:a.budgetMax,timeline:a.timeline,concerns:(a.objections||[]).concat(a.questions||[]),mentioned:a.mentioned||[],apptId:a.id,demo:a.demo}))
    .concat((S.prospects||[]).map(p=>({id:p.id,name:p.name,consultant:p.consultant,prefType:p.prefType,budgetMin:p.budgetMin,budgetMax:p.budgetMax,timeline:p.timeline,concerns:p.objections||[],mentioned:p.mentioned||[],apptId:null,demo:p.demo})));
}
function matchProspects(ev){
  const o=ev.o,comp=compById(o.compId),p=o.prodId?prodById(o.prodId):null,types=p?[p.type]:(comp.productTypes||[]),kws=eventKW(ev);
  let price=null;
  if((o.field==='Quick move-in listed'||o.category==='price')&&o.amount!=null)price=o.amount;
  else if(p){const b=best(p.id,'Starting price');if(b&&b.amount!=null)price=b.amount}
  return allProspects().map(x=>{
    if(!types.includes(x.prefType))return null;
    let pts=1;const why=['wants a '+x.prefType.toLowerCase()];
    const fits=price!=null&&price>=x.budgetMin*0.9&&price<=x.budgetMax*1.1,named=x.mentioned.includes(comp.name);
    if(price!=null&&!fits&&!named)return null;
    if(fits){pts++;why.push('budget '+money(x.budgetMin)+'–'+money(x.budgetMax))}
    const hit=x.concerns.find(t=>kws.some(r=>r.test(t)));if(hit){pts++;why.push('raised “'+hit+'”')}
    if(x.mentioned.includes(comp.name)){pts++;why.push('mentioned '+comp.name)}
    if(['qmiAdd','qmiGone','occupancy'].includes(ev.type)&&urgentT(x.timeline)){pts++;why.push('needs to move soon')}
    return pts>=2?{x,pts,rel:pts>=3?'High':'Medium',why,hit:!!hit}:null;
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts||(b.hit-a.hit));

function overlapOf(o){
  const p=o.prodId?prodById(o.prodId):null;
  if(!p)return {f:0.8,label:'Community-level change, not tied to one product',emp:null};
  const same=S.empire.filter(e=>e.type===p.type).sort((a,b)=>Math.abs(a.lot-p.lot)-Math.abs(b.lot-p.lot));
  if(!same.length)return {f:0.6,label:'No '+p.type.toLowerCase()+' product at Avalon to compare',emp:null};
  const e=same[0];
  return Math.abs(e.lot-p.lot)<=4?{f:1,label:'Directly comparable to '+e.name+' ('+p.lot+'′ vs '+e.lot+'′ lot)',emp:e}:{f:0.85,label:'Same type as '+e.name+', but a '+p.lot+'′ vs '+e.lot+'′ lot',emp:e};
}
function shopEvents(days,noExpiry){
  const c=cx(),out=[],seen=new Set();
  for(const o0 of S.obs){
    if(compArch(o0.compId)||o0.verification==='Rejected'||c.superseded.has(o0.id))continue;
    let o=o0;
    if(!MULTI.has(o.field)&&c.conflict[o.id]){const k=(o.prodId||o.compId)+'|'+o.field;if(seen.has(k))continue;seen.add(k);const v=(c.live[k]||[]).find(x=>x.verification==='Verified');if(v)o=v}
    const comp=compById(o.compId),p=o.prodId?prodById(o.prodId):null,pn=p?p.name:comp.community,who=comp.name,age=ago(o.observed);
    let type=null,sig=0,kind='threat',title='';
    if(!noExpiry&&o.category==='incentive'&&o.expires&&o.verification==='Verified'&&until(o.expires)>=0&&until(o.expires)<=7){type='expiring';sig=3;kind='watch';title=poss(who)+' '+o.field.toLowerCase()+' offer on '+pn+' ends '+fmtD(o.expires)}
    else if(age<0||age>days)continue;
    else if(o.field==='Starting price'&&o.amount!=null&&prevAmt(o)!=null){const d=o.amount-prevAmt(o);if(!d)continue;
      if(d<0){type='priceDown';sig=-d>=20000?5:-d>=10000?4:-d>=5000?3:2;title=who+' cut '+poss(pn)+' starting price by '+money(-d)+' to '+o.value}
      else{type='priceUp';kind='opportunity';sig=d>=10000?4:3;title=who+' raised '+poss(pn)+' starting price by '+money(d)+' to '+o.value}}
    else if(o.category==='incentive'){type='incentive';sig=(o.field==='Mortgage promotion'||(o.amount||0)>=20000)?4:3;title=who+(o.prev&&!/^no /i.test(o.prev)?' changed ':' launched ')+(o.field==='Mortgage promotion'?'a financing promotion':art(o.field.toLowerCase())+' offer')+' on '+pn+': '+o.value}
    else if(o.field==='Quick move-in listed'){type='qmiAdd';sig=4;title=who+' listed a new quick move-in: '+o.value}
    else if(o.field==='Quick move-in removed'){type='qmiGone';sig=4;kind='opportunity';title=who+': '+o.value}
    else if(o.category==='occupancy'&&o.prev&&occIdx(o.value)!=null&&occIdx(o.prev)!=null&&occIdx(o.value)!==occIdx(o.prev)){const later=occIdx(o.value)>occIdx(o.prev);type='occupancy';sig=3;kind=later?'opportunity':'threat';title=who+' moved '+pn+' occupancy '+(later?'later':'earlier')+', from '+o.prev+' to '+o.value}
    else if(o.category==='launch'){type='launch';sig=3;title=who+': '+o.value}
    else if(o.category==='floorplan'){type='floorplan';sig=2;title=who+(o.field==='Floorplan discontinued'?' discontinued: ':' released: ')+o.value}
    else continue;
    const ev={id:o.id,o,type,kind,sig,title};
    ev.ov=overlapOf(o);ev.matches=matchProspects(ev);
    const n=ev.matches.length;ev.expF=n>=3?1.1:n===2?1:n===1?0.95:0.75;
    ev.imm=type==='expiring'?(until(o.expires)<=3?1:0.9):(age<=3?1:age<=7?0.9:age<=30?0.75:0.6);
    ev.raw=sig*ev.ov.f*ev.expF*ev.imm;ev.score=Math.max(1,Math.min(5,Math.round(ev.raw)));
    ev.conflict=!!c.conflict[o.id];ev.usable=quotable(o)&&!ev.conflict;
    out.push(ev);
  }
  return out;
}
const ssSort=(a,b)=>b.score-a.score||((a.kind==='opportunity')-(b.kind==='opportunity'))||b.o.observed.localeCompare(a.o.observed);
const scoreBadge=e=>e.kind==='opportunity'?`<span class="score opp">Opportunity ${e.score}</span>`:`<span class="score s${e.score}">${e.kind==='watch'?'Watch':'Threat'} ${e.score}</span>`;
function exposureText(e){const n=e.matches.length,hi=e.matches.filter(m=>m.rel==='High').length,mine=e.matches.filter(m=>m.x.consultant===me().name).length;

function ccHTML(base,p,max){
  if(!p){const w=Math.round(base.price/max*100);return `<article class="cc is-base"><div class="tagl">Empire, Avalon${demoChip(base)}</div><h3>${esc(base.name)}</h3><div class="price">${money(base.price)}</div><div class="hbar"><span style="width:${w}%"></span></div><dl><dt>Home</dt><dd>${base.type}, ${base.lot}′ lot</dd><dt>Size</dt><dd>${base.sqft} sq ft</dd><dt>Beds, baths</dt><dd>${base.beds} bd, ${base.baths} ba</dd><dt>Incentive</dt><dd>${esc(base.incentive)}</dd><dt>Deposit</dt><dd>${esc(base.deposit)}</dd><dt>Occupancy</dt><dd>${esc(base.occupancy)}</dd></dl><div class="foot"><span>Baseline, Empire data (demo)</span></div></article>`}
  const c=compById(p.compId),pr=best(p.id,'Starting price'),inc=liveMulti(p.id,FIELDS.incentive),dep=best(p.id,'Deposit structure'),oc=best(p.id,'Occupancy');
  const pv=quotable(pr)&&pr.amount!=null?pr.amount:null,cov=[quotable(pr),quotable(oc),quotable(dep),inc.some(quotable)].filter(Boolean).length,diffs=[];
  if(pv!=null){const d=pv-base.price;if(d>0)diffs.push(['plus','Avalon starts '+money(d)+' lower']);else if(d<0)diffs.push(['minus','Starts '+money(-d)+' below Avalon'])}
  const r=sqRange(base.sqft);if(r){if(p.sqft>r[1])diffs.push(['minus','Larger: '+p.sqft.toLocaleString('en-CA')+' sq ft']);else if(p.sqft<r[0])diffs.push(['plus','Smaller: '+p.sqft.toLocaleString('en-CA')+' vs '+base.sqft+' sq ft'])}
  if(quotable(oc)){const a=occIdx(oc.value),b=occIdx(base.occupancy);if(a!=null&&b!=null&&a!==b)diffs.push(a<b?['minus','Earlier move-in: '+oc.value]:['plus','Later move-in: '+oc.value])}
  inc.filter(quotable).forEach(o=>diffs.push(['minus','Offering '+lc1(o.value)]));
  return `<article class="cc"><div class="tagl">${esc(c.name)}${demoChip(c)}</div><h3>${esc(p.name)}</h3><div class="price">${pv!=null?money(pv):'<span class="nv" style="font-size:15px">Price not verified</span>'}</div><div class="hbar">${pv!=null?`<span style="width:${Math.round(pv/max*100)}%"></span>`:''}</div>
  ${mismatch(base,p).map(m=>`<span class="flag">Not like-for-like: ${esc(m)}</span>`).join('')}
  <dl><dt>Home</dt><dd>${p.type}, ${p.lot}′ lot</dd><dt>Size</dt><dd>${p.sqft.toLocaleString('en-CA')} sq ft</dd><dt>Beds, baths</dt><dd>${p.beds} bd, ${p.baths} ba</dd><dt>Price</dt><dd>${evCell(pr)}</dd><dt>Incentives</dt><dd>${inc.length?inc.map(o=>evCell(o,o.field)).join(''):NV}</dd><dt>Deposit</dt><dd>${evCell(dep)}</dd><dt>Occupancy</dt><dd>${evCell(oc)}</dd></dl>
  ${diffs.length?`<ul class="diffs">${diffs.map(([k,t])=>`<li><span class="${k}" aria-hidden="true">${k==='plus'?'+':'−'}</span><span><span class="sr">${k==='plus'?'Empire advantage: ':'Competitor advantage: '}</span>${esc(t)}</span></li>`).join('')}</ul>`:''}
  <div class="foot"><span>Source coverage: ${cov} of 4 verified</span><label class="tog"><input type="checkbox" data-a="selRow" data-id="${p.id}" ${UI.cmp.sel.includes(p.id)?'checked':''}> Select</label></div></article>`;

/* ---------- briefing engine: rules over records, no AI ---------- */
function buildBriefing(a){
  const used=new Map(),use=o=>{if(o)used.set(o.id,o);return o?o.id:null};
  const B={summary:'',stated:[],empire:[],competitors:[],caution:[],incentives:[],market:[],questions:[],objections:[],talking:[],followups:[]};
  B.summary=`${a.customer}: ${a.household.toLowerCase()}, looking for a ${a.prefLot?a.prefLot+'′ ':''}${a.prefType.toLowerCase()} home with ${a.beds} bedrooms at ${a.community}. Budget ${money(a.budgetMin)}–${money(a.budgetMax)}, timeline ${a.timeline.toLowerCase()}. ${a.prevVisits?a.prevVisits+' previous visit'+(a.prevVisits>1?'s':'')+'.':'First appointment.'} Lead source: ${a.leadSource.toLowerCase()}.`;
  B.stated=[`Budget ${money(a.budgetMin)}–${money(a.budgetMax)}`,`${a.prefLot?a.prefLot+'′ ':''}${a.prefType}, ${a.beds} bedrooms`,`Timeline: ${a.timeline}`,`Lifestyle: ${a.lifestyle}`].concat(a.questions.map(q=>'Asked: '+q));
  const fit=[];
  S.empire.forEach(p=>{
    if(p.type===a.prefType){
      if(p.price<=a.budgetMax){fit.push(p);B.empire.push({t:`${p.name} from ${money(p.price)} is within budget${a.prefLot===p.lot?' and matches their lot interest':''} (demo price).`})}
      else B.empire.push({t:`${p.name} starts at ${money(p.price)}, ${money(p.price-a.budgetMax)} above the top of their budget${a.prefLot===p.lot?', though it matches their lot interest':''} (demo price).`});
    } else if(p.price<=a.budgetMax)B.empire.push({t:`${p.name} from ${money(p.price)} is within budget if they’re open to a ${p.type.toLowerCase()} (demo price).`});
  });
  if(!B.empire.length)B.empire.push({t:'No Empire product on file matches this type and budget. Confirm current availability with the sales office.'});
  const handled=new Set();
  S.products.filter(p=>!compArch(p.compId)&&p.type===a.prefType).forEach(p=>{
    const c=compById(p.compId),pr=best(p.id,'Starting price'),spec=`${p.lot}′, ${p.beds} bd, ${p.sqft.toLocaleString('en-CA')} sq ft`;
    if(quotable(pr)){
      const near=S.empire.filter(e=>e.type===p.type).sort((x,y)=>Math.abs(x.lot-p.lot)-Math.abs(y.lot-p.lot))[0];
      B.competitors.push({t:`${c.name}, ${p.name} (${spec}): ${pr.value}, verified ${fmtD(pr.verifiedOn)}${freshness(pr).k==='review'?', due for review':''}.${near?(Math.abs(near.lot-p.lot)>=5?' Lot width differs from '+near.name+'.':' Closest Empire match: '+near.name+'.'):''}`,ids:[use(pr)]});
    } else if(pr){const f=freshness(pr);B.caution.push({t:`${c.name}, ${p.name}: ${pr.value} is ${f.label.toLowerCase()} (${f.why.toLowerCase()}). Don’t quote it until it’s verified.`,ids:[use(pr)]})}
    else B.caution.push({t:`${c.name}, ${p.name}: no price on file.`});
    liveMulti(p.id,FIELDS.incentive).forEach(o=>{
      if(handled.has(o.id))return;
      const f=freshness(o);
      if(quotable(o)){B.incentives.push({t:`${c.name}, ${p.name}: ${o.value}${o.expires?', advertised until '+fmtD(o.expires):''}.`,ids:[use(o)]});return}
      const partners=(cx().conflict[o.id]||[]).map(obsById).filter(Boolean);
      partners.forEach(x=>handled.add(x.id));handled.add(o.id);
      B.caution.push({t:partners.length?`${c.name}, ${p.name}: ${o.field.toLowerCase()} reports are conflicting: ${[o].concat(partners).map(x=>x.value+' ('+SRC[x.sourceType].toLowerCase()+', '+x.verification.toLowerCase()+')').join(' vs ')}. Verify before discussing.`:`${c.name}, ${p.name}: ${o.value} is ${f.label.toLowerCase()} (${f.why.toLowerCase()}). Verify before discussing.`,ids:[use(o)].concat(partners.map(use))});
    });
  });
  B.market=shopEvents(30).filter(e=>e.usable&&e.matches.some(m=>m.x.apptId===a.id)).sort(ssSort).slice(0,4).map(e=>({t:e.title+'. '+(e.kind==='opportunity'?'Possible opportunity for Avalon.':'Threat '+e.score+' of 5.'),ids:[use(e.o)]}));
  const cands=S.competitors.filter(c=>!c.archived&&c.status==='candidate').length;
  if(cands)B.caution.push({t:`${cands} candidate builders near Avalon have no verified data. If the customer mentions one, log what they say as an observation rather than answering from memory.`});
  const L=a.lifestyle.toLowerCase();
  if(/commut|go train|transit/.test(L))B.questions.push('Which commute matters most, and at what times of day?');
  if(/school/.test(L)||/famil|child/.test(a.household.toLowerCase()))B.questions.push('Which schools or programs are on your list?');
  const over=S.empire.find(p=>p.type===a.prefType&&p.lot===a.prefLot&&p.price>a.budgetMax);
  if(over&&fit.length)B.questions.push(`Would a ${fit[0].lot}′ ${fit[0].type.toLowerCase()} work if it keeps you within budget, or is the ${a.prefLot}′ lot the priority?`);
  if(/month/.test(a.timeline.toLowerCase()))B.questions.push('Is your timeline tied to selling your current home?');
  B.questions.push('Which other communities are you considering, and what stood out there?');
  const kw=[[/decor/,'Decor credit'],[/deposit/,'Deposit structure'],[/closing/,'Closing costs'],[/price|square|sq/,'Starting price'],[/move|occupan/,'Occupancy'],[/appliance/,'Appliance package'],[/mortgage|rate/,'Mortgage promotion']];
  a.objections.forEach(txt=>{
    const m=kw.find(([r])=>r.test(txt.toLowerCase()));
    if(!m){B.objections.push({t:`“${txt}”: no matching records on file. Ask for specifics and log them.`});return}
    const found=S.obs.filter(o=>o.field===m[1]&&!compArch(o.compId)&&o.verification!=='Rejected'&&!cx().superseded.has(o.id));
    const ok=found.filter(quotable),bad=found.filter(o=>!quotable(o));
    B.objections.push({t:`“${txt}”: ${ok.length?ok.length+' verified '+m[1].toLowerCase()+' record'+(ok.length>1?'s':''):'no verified '+m[1].toLowerCase()+' records'} on file${bad.length?', plus '+bad.length+' unverified, stale or conflicting':''}. Ask which builder and exactly what was offered, then log it.`,ids:ok.concat(bad).map(use)});
  });
  fit.forEach(e=>{
    S.products.filter(p=>!compArch(p.compId)&&p.type===e.type&&Math.abs(p.lot-e.lot)<=4).forEach(p=>{
      const pr=best(p.id,'Starting price');if(!quotable(pr)||pr.amount==null)return;const c=compById(p.compId),d=pr.amount-e.price;
      if(d>0)B.talking.push({t:`${e.name} starts ${money(d)} below ${c.name}’s ${p.name} at a similar lot width (${p.lot}′). Lead with value on a like-for-like lot.`,ids:[use(pr)]});
      else if(d<0)B.talking.push({t:`${c.name}’s ${p.name} starts ${money(-d)} lower than ${e.name} at a similar lot width. Be ready to walk through what’s included rather than meeting on price.`,ids:[use(pr)]});
    });
  });
  if(a.questions.some(q=>/appliance/i.test(q))){const e=fit.find(x=>/appliance/i.test(x.incentive));B.talking.push({t:e?`They asked about appliances. ${e.name} lists: ${e.incentive} (demo).`:`They asked about appliances. Confirm what’s included with ${fit.length?fit[0].name:'the homes they like'} before the appointment.`})}
  if(!B.talking.length)B.talking.push({t:'No verified like-for-like comparison is available yet. Focus on discovery and log what they share about other builders.'});
  if(B.caution.some(x=>/conflicting/.test(x.t)))B.followups.push(`Ask a reviewer to resolve the conflicting incentive reports before ${a.date===TODAY?'the appointment':fmtD(a.date)}.`);
  if(fit.length)B.followups.push(`Send floorplans for ${fit.map(f=>f.name).join(' and ')}.`);
  B.followups.push('Record the outcome, and log any competitor offers they mention as observations.');
  const sources=[...used.values()].map(o=>({id:o.id,label:subj(o)+', '+o.field,value:o.value,src:SRC[o.sourceType],ref:o.sourceRef,obs:o.observed,conf:confidence(o).level,fresh:freshness(o).label}));
  return {at:new Date().toISOString(),by:me().name,B,sources};
}

function renderLayer(){
  const prev=document.querySelector('#layer .drawer .db'),st=prev?prev.scrollTop:0;
  const top=UI.stack[UI.stack.length-1];let h='';
  if(top){const inner=top.type==='comp'?dComp(top):top.type==='obs'?dObs(top):top.type==='appt'?dAppt(top):top.type==='compare'?dCompare():top.type==='prep'?dPrep(top):top.type==='ins'?dIns(top):'';h+=`<div class="scrim" data-a="closeDrawer"></div><aside class="drawer ${top.type==='compare'?'wide':''}" role="dialog" aria-modal="true" aria-label="Details">${inner}</aside>`}

function setVer(o,status,note){
  o.verification=status;
  if(status==='Verified'){o.reviewer=me().name;o.verifiedOn=TODAY;o.markedStale=false;if(!o.revalidateBy||until(o.revalidateBy)<0)o.revalidateBy=dOff(30)}
  o.history.push({at:TODAY,by:me().name,action:status==='More info required'?'Requested more evidence':status,note:note||''});
  audit(`${status==='Verified'?'Approved':status==='Rejected'?'Rejected':'Requested evidence for'} ${o.id} (${subj(o)}, ${o.field})`);save();
}
function printHTML(title,html){
  const r=document.getElementById('print-root');r.innerHTML=`<h1>${esc(title)}</h1><p>Empire Sales Intelligence, printed ${fmtD(TODAY)}. Records marked Demo are fictional.</p>`+html;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  try{window.print()}catch(e){done();toast('Printing isn’t available in this view. Use Export instead.',true)}
  setTimeout(done,1500);
}
function cmpCSV(){
  const {base,rows}=cmpData(),sel=UI.cmp.sel.filter(id=>prodById(id));
  const pick=sel.length?rows.filter(r=>r.p&&sel.includes(r.p.id)):rows;
  const out=[['Data label','Builder','Community','Product','Type','Lot width (ft)','Beds','Baths','Sq ft','Starting price (CAD)','Price record','Price source','Price observed','Price confidence','Price freshness','Incentives','Deposit','Occupancy','Comparison flag']];
  out.push(['DEMO','Empire Communities','Avalon',base.name,base.type,base.lot,base.beds,base.baths,base.sqft,base.price,'','Empire product data (demo)','','','',base.incentive,base.deposit,base.occupancy,'Baseline']);
  pick.forEach(({c,p})=>{
    if(!p){out.push([c.demo?'DEMO':'Not verified',c.name,c.community,'','','','','','','Not verified','','','','','','Not verified','Not verified','Not verified','No data on file']);return}
    const pr=best(p.id,'Starting price'),inc=liveMulti(p.id,FIELDS.incentive),dep=best(p.id,'Deposit structure'),occ=best(p.id,'Occupancy');
    out.push([c.demo?'DEMO':'',c.name,c.community,p.name,p.type,p.lot,p.beds,p.baths,p.sqft,pr&&pr.amount!=null?pr.amount:'Not verified',pr?pr.id:'',pr?SRC[pr.sourceType]+': '+(pr.sourceRef||'no reference'):'',pr?pr.observed:'',pr?confidence(pr).level:'',pr?freshness(pr).label:'',inc.map(o=>o.value+' ('+freshness(o).label+')').join('; ')||'Not verified',dep?dep.value+' ('+freshness(dep).label+')':'Not verified',occ?occ.value+' ('+freshness(occ).label+')':'Not verified',mismatch(base,p).join('; ')]);
  });
  return toCSV(out);
}

document.addEventListener('scroll',()=>{if(UI.tip){UI.tip=null;renderTip()}},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.k)UI.open[d.dataset.k]=d.open},true);
document.addEventListener('input',onField);document.addEventListener('change',onField);

render();
})();
</script>
