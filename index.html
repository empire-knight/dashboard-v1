@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap');
.dp *{box-sizing:border-box;}
.dp{--canvas:#ECEBE0;--panel:#F7F7EE;--card:#FCFCF6;--cardh:#FFFFFF;--blue:#003349;--white:#F7F7EE;
  --text:#003349;--soft:rgba(0,51,73,.60);--faint:rgba(0,51,73,.38);--line:rgba(0,51,73,.10);--lineS:rgba(0,51,73,.16);
  --sidebar:#F5F4EA;--frost:#C6DCDA;--frostS:rgba(198,220,218,.45);--accent:#FF5C39;--accentS:rgba(255,92,57,.12);
  --burg:#6F2C3F;--yellow:#D9C756;
  --shadow:0 1px 2px rgba(0,51,73,.05),0 14px 34px -20px rgba(0,51,73,.26);
  font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--canvas);height:100vh;width:100%;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;}
.dp-d{font-family:'Josefin Sans','Inter',sans-serif;}
.dp-lab{text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:10px;color:var(--faint);}
.dp-scroll::-webkit-scrollbar{width:10px;}.dp-scroll::-webkit-scrollbar-thumb{background:var(--lineS);border-radius:20px;border:3px solid transparent;background-clip:content-box;}

/* rail */
.dp-rail{width:216px;min-width:216px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;}
.dp-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 4px;margin-bottom:6px;}
.dp-brand b{font-family:'Josefin Sans';font-weight:700;font-size:16px;letter-spacing:.02em;}
.dp-av{width:32px;height:32px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dp-grp{margin-top:18px;}.dp-grp .dp-lab{padding:0 10px 8px;display:block;}
.dp-cat{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border:none;background:transparent;color:var(--soft);cursor:pointer;border-radius:9px;font-size:13.5px;font-weight:500;text-align:left;transition:.16s;position:relative;}
.dp-cat:hover,.dp-cat.on{background:var(--frostS);color:var(--text);}
.dp-cat.on{font-weight:600;}
.dp-cat.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--dept,var(--accent));}
.dp-sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.dp-cat .c{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600;}
.dp-railf{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.dp-user{display:flex;align-items:center;gap:11px;padding:7px 8px;}

/* main */
.dp-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.dp-top{height:60px;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1px solid var(--line);}
.dp-crumb{font-size:13px;color:var(--soft);font-weight:500;}.dp-crumb b{color:var(--text);font-weight:600;}
.dp-search{margin-left:auto;display:flex;align-items:center;gap:9px;width:230px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--faint);font-size:13px;}
/* version switcher */
.dp-body{flex:1;overflow-y:auto;padding:26px 30px 64px;}

/* stats band */
.dp-stats{background:var(--blue);border-radius:18px;padding:24px 30px;display:flex;align-items:center;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:22px;}
.dp-stats .crowns{position:absolute;right:-6px;bottom:-24px;display:flex;align-items:flex-end;gap:12px;opacity:.22;}
.dp-stats .crowns span{background:#C6DCDA;clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%);}
.dp-lead{margin-right:auto;}
.dp-lead .k{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.dp-lead h1{font-family:'Josefin Sans';font-weight:600;font-size:23px;color:var(--white);margin:0;}
.dp-lead p{margin:4px 0 0;font-size:12.5px;color:rgba(244,244,236,.6);}
.dp-st .num{font-family:'Josefin Sans';font-weight:600;font-size:32px;line-height:1;color:var(--white);}
.dp-st .l{font-size:10.5px;color:rgba(244,244,236,.6);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;}

/* quick actions */
.dp-qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;}
.dp-qb{display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;text-align:left;font-family:'Inter';transition:.18s;}
.dp-qb:hover{border-color:var(--accent);background:var(--accentS);transform:translateY(-2px);}
.dp-qb .i{width:34px;height:34px;border-radius:9px;background:var(--accentS);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* department tiles (live/beta only) */
.dp-dept{margin-bottom:28px;}
.dp-dh{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.dp-dh .bar{width:4px;height:18px;border-radius:3px;}
.dp-dh h2{font-family:'Josefin Sans';font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0;}
.dp-dh .c{font-size:11.5px;color:var(--faint);font-weight:500;}
.dp-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.dp-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:.2s;}
.dp-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--lineS);background:var(--cardh);}
.dp-tt{display:flex;align-items:center;gap:11px;}
.dp-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dp-n{font-family:'Josefin Sans';font-weight:600;font-size:15px;line-height:1.1;}
.dp-c{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:3px;}
.dp-tf{display:flex;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.dp-live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:#2f9e77;}
.dp-live .d{width:6px;height:6px;border-radius:50%;background:#2f9e77;}
.dp-beta{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accentS);padding:3px 8px;border-radius:20px;}
.dp-mini{margin-left:auto;font-size:11px;color:var(--soft);font-weight:600;}.dp-mini b{font-family:'Josefin Sans';font-size:13px;color:var(--text);}
.dp-arr{margin-left:auto;color:var(--faint);}

/* section head w/ rule */
.dp-sec{display:flex;align-items:center;gap:12px;margin:34px 0 16px;}
.dp-sec h2{font-family:'Josefin Sans';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:0;white-space:nowrap;}
.dp-sec .rule{flex:1;height:1px;background:var(--line);}
.dp-sec .cnt{font-size:12px;color:var(--faint);}

/* coming soon (build-3 dashed cards) */
.dp-soon{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.dp-sc{border:1px dashed var(--lineS);border-radius:14px;padding:16px;display:flex;gap:13px;align-items:flex-start;transition:.2s;}
.dp-sc:hover{background:var(--frostS);border-color:var(--faint);}
.dp-sc .n{font-family:'Josefin Sans';font-weight:600;font-size:15px;}
.dp-sc .c{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:3px;}
.dp-sc .d{font-size:12px;color:var(--soft);line-height:1.45;margin-top:9px;}
.dp-badge{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--yellow);background:rgba(217,199,86,.16);padding:3px 8px;border-radius:20px;margin-left:auto;flex-shrink:0;}

/* ===== V1 request banner ===== */
.dp-banner{margin-top:22px;border-radius:18px;padding:26px 28px;background:linear-gradient(120deg,var(--panel),var(--card));border:1px solid var(--line);position:relative;overflow:hidden;}
.dp-banner .roof{position:absolute;right:-30px;top:-40px;width:180px;height:180px;background:var(--frostS);clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%);opacity:.6;}
.dp-banner h3{font-family:'Josefin Sans';font-weight:600;font-size:22px;margin:0 0 6px;position:relative;}
.dp-banner p{margin:0 0 18px;font-size:13.5px;color:var(--soft);max-width:520px;position:relative;}
.dp-inrow{display:flex;gap:10px;max-width:640px;position:relative;}
.dp-input{flex:1;display:flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--lineS);border-radius:12px;background:var(--cardh);}
.dp-input input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:'Inter';}
.dp-input input::placeholder{color:var(--faint);}
.dp-submit{display:inline-flex;align-items:center;gap:8px;padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter';transition:.18s;}
.dp-submit:hover{filter:brightness(1.05);transform:translateY(-1px);}
.dp-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;}
.dp-chip{font-size:12px;font-weight:500;color:var(--soft);background:var(--frostS);border:1px solid var(--line);padding:6px 12px;border-radius:100px;cursor:pointer;transition:.16s;}
.dp-chip:hover{border-color:var(--accent);color:var(--accent);}
.dp-recent{margin-top:16px;font-size:12px;color:var(--faint);position:relative;}
.dp-recent b{color:var(--soft);font-weight:600;}

/* website request action cards (above the request section) */
.dp-actions2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;}
.dp-actcard{display:flex;align-items:center;gap:14px;padding:17px 18px;border:1px solid var(--lineS);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;font-family:'Inter';transition:.18s;}
.dp-actcard:hover{border-color:var(--accent);background:var(--accentS);transform:translateY(-2px);box-shadow:var(--shadow);}
.dp-actcard .ai{width:42px;height:42px;border-radius:12px;background:var(--accentS);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dp-actcard .at{font-family:'Josefin Sans';font-weight:600;font-size:15.5px;color:var(--text);}
.dp-actcard .ad{font-size:12px;color:var(--soft);margin-top:2px;}
.dp-actcard .ar{margin-left:auto;color:var(--faint);transition:transform .2s,color .2s;}
.dp-actcard:hover .ar{color:var(--accent);transform:translateX(4px);}

@media (max-width:1040px){.dp-qa{grid-template-columns:repeat(2,1fr);}.dp-soon{grid-template-columns:1fr 1fr;}.dp-actions2{grid-template-columns:1fr;}}
@media (prefers-reduced-motion:reduce){.dp *{transition:none!important;}}
/* modal */
.dp-overlay{position:fixed;inset:0;background:rgba(0,20,28,.5);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;animation:dpFade .18s ease;}
@keyframes dpFade{from{opacity:0}to{opacity:1}}
@keyframes dpPop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.dp-modal{width:min(540px,94vw);background:var(--panel);border:1px solid var(--lineS);border-radius:18px;box-shadow:0 30px 70px -24px rgba(0,0,0,.5);padding:24px;animation:dpPop .22s cubic-bezier(.2,.8,.2,1);}
.dp-mhd{display:flex;align-items:flex-start;margin-bottom:4px;}
.dp-mhd h3{font-family:'Josefin Sans';font-weight:600;font-size:22px;margin:4px 0 0;}
.dp-x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;flex-shrink:0;}
.dp-x:hover{background:var(--cardh);color:var(--text);}
.dp-msub{font-size:13.5px;color:var(--soft);line-height:1.5;margin:8px 0 16px;}
.dp-ta{width:100%;min-height:104px;resize:vertical;border:1px solid var(--lineS);border-radius:12px;background:var(--cardh);padding:13px 15px;font-family:'Inter';font-size:14px;color:var(--text);outline:none;transition:.16s;}
.dp-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS);}
.dp-ta::placeholder{color:var(--faint);}
.dp-mft{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
.dp-track{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:11px;border:1px solid var(--lineS);background:var(--card);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Inter';transition:.18s;}
.dp-track:hover{background:var(--cardh);transform:translateY(-1px);box-shadow:var(--shadow);}
.dp-track .b{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.dp-track.bugherd{border-color:rgba(47,158,119,.5);}.dp-track.bugherd .b{background:#2f9e77;}
.dp-track.smartsheet{border-color:rgba(11,107,203,.5);}.dp-track.smartsheet .b{background:#0b6bcb;}
.dp-hint{font-size:11.5px;color:var(--faint);margin-top:13px;display:flex;align-items:center;gap:7px;}
.dp-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;padding:13px 20px;background:var(--blue);color:var(--white);border-radius:13px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);font-size:13.5px;font-weight:600;animation:dpPop .3s cubic-bezier(.2,.8,.2,1);}
.dp-field{margin-bottom:12px;}
.dp-flabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--faint);margin-bottom:6px;display:block;}
.dp-tinput,.dp-select{width:100%;padding:12px 14px;border:1px solid var(--lineS);border-radius:12px;background:var(--cardh);font-family:'Inter';font-size:14px;color:var(--text);outline:none;transition:.16s;}
.dp-tinput::placeholder{color:var(--faint);}
.dp-tinput:focus,.dp-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS);}
.dp-select{cursor:pointer;}
.dp :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
