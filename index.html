<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empire Sales Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7EE;--surface:#FFFFFF;--surface-2:#FBFBF5;--ink:#333E48;--ink-2:#5D6873;--ink-3:#8A939A;
  --line:#E4E3D7;--line-2:#D2D0C2;--navy:#003349;--navy-2:#0B4560;--on-navy:#FFFFFF;
  --side:#003349;--side-ink:#DCE6E9;--side-ink-2:#8FAAB6;
  --frost:#C6DCDA;--frost-soft:#E6EFEE;--orange:#FF5C39;--orange-ink:#B5401F;
  --burg:#6F2C3F;--burg-soft:#F1E3E7;--sun:#D9C756;--sun-soft:#F4EFCB;--sun-ink:#62570F;
  --good:#2E6A4E;--good-soft:#DCEBE2;--shadow:0 16px 48px rgba(0,26,38,.2);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A21;--surface:#13232C;--surface-2:#172A33;--ink:#E5E9E4;--ink-2:#AEB8BD;--ink-3:#7D8990;
  --line:#22363F;--line-2:#304751;--navy:#86B9CE;--navy-2:#A3CBDB;--on-navy:#04212E;
  --side:#06171F;--side-ink:#D3DEE2;--side-ink-2:#7C97A3;
  --frost:#2C4D52;--frost-soft:#1A3238;--orange:#FF6E4E;--orange-ink:#FF9277;
  --burg:#E3A6B6;--burg-soft:#3A2129;--sun:#D9C756;--sun-soft:#353015;--sun-ink:#E6D97E;
  --good:#8ACBA6;--good-soft:#1A3427;--shadow:0 16px 48px rgba(0,0,0,.55);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1A21;--surface:#13232C;--surface-2:#172A33;--ink:#E5E9E4;--ink-2:#AEB8BD;--ink-3:#7D8990;
  --line:#22363F;--line-2:#304751;--navy:#86B9CE;--navy-2:#A3CBDB;--on-navy:#04212E;
  --side:#06171F;--side-ink:#D3DEE2;--side-ink-2:#7C97A3;
  --frost:#2C4D52;--frost-soft:#1A3238;--orange:#FF6E4E;--orange-ink:#FF9277;
  --burg:#E3A6B6;--burg-soft:#3A2129;--sun:#D9C756;--sun-soft:#353015;--sun-ink:#E6D97E;
  --good:#8ACBA6;--good-soft:#1A3427;--shadow:0 16px 48px rgba(0,0,0,.55);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .w{font-family:"Josefin Sans",Inter,sans-serif;font-weight:700;font-size:23px;letter-spacing:.04em;line-height:1;color:#fff;padding-top:3px}
.brand .s{font-size:12.5px;color:var(--side-ink-2);margin-top:7px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:4px;color:var(--side-ink);text-decoration:none;font-size:13.5px;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:rgba(198,220,218,.13);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.nav .badge{margin-left:auto;font-size:11px;background:var(--orange);color:#fff;border-radius:3px;padding:0 6px;font-weight:600;line-height:18px}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.collapse-btn{background:none;border:0;color:var(--side-ink-2);display:flex;align-items:center;gap:12px;padding:8px 10px;cursor:pointer;width:100%;border-radius:4px;font-size:12.5px}
.collapse-btn svg{width:18px;height:18px;flex:none}
.app.collapsed .lbl,.app.collapsed .brand .s,.app.collapsed .nav .badge{display:none}
.app.collapsed .brand{padding:22px 0 18px;text-align:center}
.app.collapsed .brand .w{font-size:0}.app.collapsed .brand .w::before{content:"E";font-size:23px}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}

.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 24px;flex-wrap:wrap}
.search{position:relative;flex:1 1 260px;max-width:440px}
.search svg{position:absolute;left:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:7px 10px 7px 34px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:13px}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);z-index:30;max-height:360px;overflow-y:auto}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button:focus-visible{background:var(--frost-soft)}
.sres .k{font-size:11.5px;color:var(--ink-3);display:block}
.top .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.icon-btn{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:600;border-radius:3px;padding:0 4px;line-height:16px}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:340px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);z-index:30}
.pop-h{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.pop button.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;cursor:pointer;font-size:12.5px}
.pop button.item:hover{background:var(--frost-soft)}

.demo-note{margin:14px 24px 0;padding:8px 12px;border:1px dashed var(--line-2);border-radius:4px;color:var(--ink-2);font-size:12.5px;background:var(--surface-2)}
.content{padding:18px 24px 56px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:"Josefin Sans",Inter,sans-serif;font-weight:600;font-size:31px;line-height:1.1;margin:0;padding-top:4px;color:var(--navy)}
.ph p{margin:6px 0 0;color:var(--ink-2)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px;border:0;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer} button.kpi:hover{background:var(--surface-2)}
.kpi .v{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:12.5px;color:var(--ink);margin-top:5px;font-weight:500}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.kpi.alert .v{color:var(--orange-ink)}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1150px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:14.5px;font-weight:600;margin:0}
.panel-h .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.panel-b{padding:14px 16px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);font-size:13px}
.empty .btn{margin-top:10px}

.row-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.ri-t{font-weight:500}
.ri-meta{font-size:12px;color:var(--ink-2);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:3px}
.ri-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.chg{font-variant-numeric:tabular-nums;margin-top:2px}
.chg .prev{color:var(--ink-3);text-decoration:line-through}
.why{font-size:12.5px;color:var(--ink-2);margin-top:2px}
@media (max-width:700px){.row-item{grid-template-columns:minmax(0,1fr)}.ri-acts{justify-content:flex-start}}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;line-height:18px;padding:0 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.f-current{background:var(--good-soft);color:var(--good)}
.f-review{background:var(--sun-soft);color:var(--sun-ink)}
.f-stale{border:1px dashed var(--ink-3);color:var(--ink-2)}
.f-expired{background:var(--burg-soft);color:var(--burg)}
.f-conflict{background:var(--orange);color:#fff}
.f-unverified{border-color:var(--line-2);color:var(--ink-2)}
.f-rejected,.f-superseded{color:var(--ink-3);border-color:var(--line)}
.vs-Verified{border-color:var(--good);color:var(--good)}
.vs-Pending{border-color:var(--sun);color:var(--sun-ink)}
.vs-More{border-color:var(--orange);color:var(--orange-ink)}
.vs-Rejected{border-color:var(--burg);color:var(--burg)}
.chip{font-size:10.5px;padding:0 5px;border-radius:3px;line-height:16px;font-weight:500;white-space:nowrap;display:inline-block;vertical-align:1px}
.chip.demo{border:1px dashed var(--ink-3);color:var(--ink-2)}
.chip.cand{border:1px solid var(--frost);background:var(--frost-soft);color:var(--ink-2)}
.chip.arch{border:1px solid var(--line-2);color:var(--ink-3)}
.flag{display:inline-block;font-size:11px;color:var(--orange-ink);border:1px solid var(--orange);border-radius:3px;padding:0 5px;line-height:16px;margin-top:3px;white-space:nowrap}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.conf i{display:inline-flex;gap:2px;font-style:normal}
.conf i b{width:4px;height:11px;background:var(--line-2);border-radius:1px}
.conf i b.on{background:var(--navy)}

.ev{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:1px 0 1px 8px;border-left:3px solid var(--line-2);min-width:96px;margin:1px 0}
.ev:hover .val{text-decoration:underline}
.ev:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ev .val{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}
.ev .lbl2{color:var(--ink-2);font-size:11.5px;margin-right:4px}
.ev .m{display:block;font-size:11px;color:var(--ink-3);line-height:1.35}
.ev[data-f="current"]{border-left-color:var(--good)}
.ev[data-f="review"]{border-left-color:var(--sun)}
.ev[data-f="stale"]{border-left-style:dashed;border-left-color:var(--ink-3)}
.ev[data-f="expired"]{border-left-color:var(--burg)}
.ev[data-f="conflict"]{border-left-color:var(--orange)}
.ev[data-f="unverified"]{border-left-style:dotted;border-left-color:var(--ink-3)}
.nv{color:var(--ink-3);font-style:italic;font-size:12.5px;white-space:nowrap}

.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--surface-2);text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface-2)}
.t tr.base td{background:var(--frost-soft)}
.t tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
.t .r{text-align:right}.t .nw{white-space:nowrap}
.t td.cb,.t th.cb{width:34px;padding-right:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.pri:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.link{border-color:transparent;background:none;padding:3px 6px;color:var(--navy)}
.btn.link:hover{text-decoration:underline}
.btn.warn{color:var(--burg);border-color:var(--burg-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.in{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:6px 10px;font-size:13px;min-height:32px;max-width:100%}
textarea.in{min-height:84px;resize:vertical;width:100%;line-height:1.45}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.field .in{width:100%}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field .err{font-size:11.5px;color:var(--orange-ink)}
.field .err:empty{display:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.span2{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.checks label{display:inline-flex;gap:6px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .in{min-height:30px;padding:4px 8px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:12.5px;cursor:pointer;border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-size:13px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange);font-weight:500}
.tabs .n{font-size:11px;color:var(--ink-3);margin-left:4px}

.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 16px;font-size:13px;margin:0}
.dl dt{color:var(--ink-2)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 24px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--frost-soft);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--navy)}
.bar-row .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}

.scrim{position:fixed;inset:0;background:rgba(0,20,30,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
.drawer.wide{width:min(980px,100%)}
@keyframes slide{from{transform:translateX(28px);opacity:.5}}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .t{flex:1;min-width:0}
.dh h2{font-family:"Josefin Sans",Inter,sans-serif;font-weight:600;font-size:23px;margin:0;line-height:1.15;padding-top:3px;color:var(--navy)}
.dh .s{font-size:12.5px;color:var(--ink-2);margin-top:4px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.db{overflow-y:auto;padding:16px 20px 24px;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-top:20px}.sec:first-child{margin-top:0}
.sec h3{font-size:13.5px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 48px);background:var(--surface);z-index:51;border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.scrim.m{z-index:50}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 16px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--navy)}
.timeline li.rej::before{border-color:var(--ink-3)}
.timeline .when{font-size:11.5px;color:var(--ink-3)}

.brief ul{margin:0;padding-left:18px}.brief li{margin:4px 0}
.tag{font-size:10.5px;font-weight:500;padding:0 6px;border-radius:3px;line-height:16px;white-space:nowrap}
.tag.st{background:var(--frost-soft);color:var(--ink-2);border:1px solid var(--frost)}
.tag.rec{border:1px solid var(--sun);color:var(--sun-ink)}
.tag.vf{border:1px solid var(--good);color:var(--good)}
.tag.cau{border:1px solid var(--orange);color:var(--orange-ink)}
.srcref{font-size:11.5px}
.srcref button{all:unset;cursor:pointer;color:var(--navy);text-decoration:underline;text-underline-offset:2px}
.srcref button:focus-visible{outline:2px solid var(--orange)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}

.integ{display:grid;grid-template-columns:minmax(0,220px) 130px minmax(0,1fr);gap:4px 18px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.integ:last-child{border-bottom:0}
.integ .nm{font-weight:600}
@media (max-width:760px){.integ{grid-template-columns:minmax(0,1fr)}}
.st-Connected{border-color:var(--good);color:var(--good)}

/* ---------- lookups ---------- */
const compById=id=>S.competitors.find(c=>c.id===id);
const prodById=id=>S.products.find(p=>p.id===id);
const obsById=id=>S.obs.find(o=>o.id===id);

const isChange=o=>o.verification!=='Rejected'&&(!!o.prev||['launch','floorplan','inventory'].includes(o.category));
const byObsDesc=(a,b)=>b.observed.localeCompare(a.observed)||b.id.localeCompare(a.id);

/* ---------- conflict / supersede engine ---------- */
const norm=o=>o.amount!=null&&o.category!=='deposit'?String(o.amount):String(o.value).toLowerCase().replace(/[^a-z0-9$%.]/g,'');
function cx(){
  if(_cx)return _cx;
  const groups={},conflict={},superseded=new Set(),live={};
  for(const o of S.obs){if(o.verification==='Rejected'||MULTI.has(o.field))continue;const k=(o.prodId||o.compId)+'|'+o.field;(groups[k]=groups[k]||[]).push(o)}
  for(const k in groups){
    const g=groups[k].slice().sort(byObsDesc);
    const ver=g.filter(o=>o.verification==='Verified');const lv=ver[0]||null;
    ver.slice(1).forEach(o=>superseded.add(o.id));
    g.filter(o=>o.verification!=='Verified'&&lv&&o.observed<lv.observed).forEach(o=>superseded.add(o.id));
    const L=(lv?[lv]:[]).concat(g.filter(o=>o.verification!=='Verified'&&(!lv||o.observed>=lv.observed)));
    live[k]=L;
    if(new Set(L.map(norm)).size>1)L.forEach(o=>{conflict[o.id]=L.filter(x=>norm(x)!==norm(o)).map(x=>x.id)});
  }
  return _cx={conflict,superseded,live};
}
function best(key,field){const L=cx().live[key+'|'+field];if(!L||!L.length)return null;return L.find(o=>o.verification==='Verified')||L[0]}
function liveMulti(key,fields){return S.obs.filter(o=>(o.prodId||o.compId)===key&&fields.includes(o.field)&&o.verification!=='Rejected'&&!cx().superseded.has(o.id)).sort(byObsDesc)}

/* ---------- confidence (explainable) and freshness (separate) ---------- */
function confidence(o){
  const off=OFFICIAL.includes(o.sourceType);
  if(!o.sourceRef)return {level:'Low',why:'No source or evidence reference attached'};
  if(off&&o.verification==='Verified')return {level:'High',why:SRC[o.sourceType]+', reviewed by '+(o.reviewer||'a reviewer')};
  if(off)return {level:'Medium',why:SRC[o.sourceType]+', awaiting review'};
  if(o.sourceType==='third_party')return o.verification==='Verified'?{level:'Medium',why:'Third-party listing checked against other evidence'}:{level:'Low',why:'Third-party listing, not corroborated'};
  const n=1+(o.corroborations||0),kind=o.sourceType==='buyer_report'?'buyer report':'sales observation';
  if(n>=2)return {level:'Medium',why:n+' consistent '+kind+'s'};
  return {level:'Low',why:'Single '+kind+', not corroborated'};
}
function freshness(o){
  const c=cx();
  if(o.verification==='Rejected')return {k:'rejected',label:'Rejected',why:'Rejected by a reviewer'};
  if(c.superseded.has(o.id))return {k:'superseded',label:'Superseded',why:'A newer verified observation replaced this one'};
  if(c.conflict[o.id])return {k:'conflict',label:'Conflicting',why:'Disagrees with '+c.conflict[o.id].map(id=>{const x=obsById(id);return x?x.value+' ('+SRC[x.sourceType].toLowerCase()+')':id}).join(', ')};
  if(o.verification!=='Verified')return {k:'unverified',label:'Unverified',why:o.verification==='More info required'?'Waiting on more evidence':'Not reviewed yet'};
  if(o.expires&&until(o.expires)<0)return {k:'expired',label:'Expired',why:'Advertised end date passed ('+fmtD(o.expires)+')'};
  if(o.revalidateBy&&until(o.revalidateBy)<0)return {k:'expired',label:'Expired',why:'Revalidation was due '+fmtD(o.revalidateBy)};
  if(o.markedStale)return {k:'stale',label:'Stale',why:'Marked stale by a reviewer'};
  const a=ago(o.observed);
  if(a>45)return {k:'stale',label:'Stale',why:'Last observed '+a+' days ago'};
  if(a>21||(o.revalidateBy&&until(o.revalidateBy)<=7))return {k:'review',label:'Needs review',why:o.revalidateBy&&until(o.revalidateBy)<=7?'Revalidation due '+fmtD(o.revalidateBy):'Observed '+a+' days ago'};
  return {k:'current',label:'Current',why:'Observed '+rel(o.observed)+(o.revalidateBy?'; revalidate by '+fmtD(o.revalidateBy):'')};
}
const quotable=o=>!!o&&o.verification==='Verified'&&['current','review'].includes(freshness(o).k);

/* ---------- render atoms ---------- */
const confHTML=o=>{const c=confidence(o),n={High:3,Medium:2,Low:1}[c.level];return `<span class="conf" title="${esc(c.why)}"><i>${[1,2,3].map(i=>`<b class="${i<=n?'on':''}"></b>`).join('')}</i>${c.level}</span>`};
const freshHTML=o=>{const f=freshness(o);return `<span class="pill f-${f.k}" title="${esc(f.why)}">${f.label}</span>`};
const vsHTML=v=>`<span class="pill vs-${esc(String(v).split(' ')[0])}">${esc(v)}</span>`;

}

/* ---------- derived sets ---------- */
function visibleAppts(){const r=me();if(r.customers==='none')return [];if(r.customers==='own')return S.appts.filter(a=>a.consultant===r.name);return S.appts}
function kpis(){
  const act=S.competitors.filter(c=>!c.archived),live=S.obs.filter(o=>!compArch(o.compId));
  return {
    builders:new Set(act.map(c=>c.name.trim().toLowerCase())).size,
    comms:new Set(act.map(c=>c.community.trim().toLowerCase())).size,
    verified:live.filter(o=>o.verification==='Verified'&&!cx().superseded.has(o.id)).length,
    changes:live.filter(o=>isChange(o)&&ago(o.observed)<=30&&ago(o.observed)>=0).length,
    appts:visibleAppts().filter(a=>a.date>=TODAY&&!['Cancelled','Completed'].includes(a.status)).length,
    needs:live.filter(o=>['unverified','conflict','expired'].includes(freshness(o).k)).length
  };
}
function attention(){
  const items=[];
  for(const o of S.obs){
    if(compArch(o.compId))continue;const f=freshness(o);
    if(f.k==='expired')items.push({kind:'Expired',cls:'f-expired',o,text:f.why});
    else if(f.k==='conflict')items.push({kind:'Conflicting',cls:'f-conflict',o,text:f.why});
    else if(f.k==='unverified'&&!OFFICIAL.includes(o.sourceType))items.push({kind:'Unverified report',cls:'f-unverified',o,text:SRC[o.sourceType]+', '+rel(o.observed)});
    else if(f.k==='stale')items.push({kind:'Stale',cls:'f-stale',o,text:f.why});
    if(!o.sourceRef&&o.verification!=='Rejected')items.push({kind:'Missing source',cls:'f-stale',o,text:'No evidence reference attached'});
    if(o.expires&&o.verification==='Verified'&&f.k!=='expired'&&until(o.expires)<=7)items.push({kind:'Promotion ending',cls:'f-review',o,text:'Advertised to end '+fmtD(o.expires)+' ('+rel(o.expires)+')'});
  }
  const order={Conflicting:0,Expired:1,'Promotion ending':2,'Missing source':3,'Unverified report':4,Stale:5};
  return items.sort((a,b)=>order[a.kind]-order[b.kind]);
}
function recs(){
  const out=[],seen=new Set(),c=cx();
  for(const o of S.obs){
    if(compArch(o.compId)||!c.conflict[o.id])continue;const key=(o.prodId||o.compId)+'|'+o.field;if(seen.has(key))continue;seen.add(key);
    const g=c.live[key]||[o];
    out.push({p:1,title:'Resolve conflicting '+o.field.toLowerCase()+' reports for '+subj(o),why:g.map(x=>x.value+' ('+SRC[x.sourceType].toLowerCase()+', '+x.verification.toLowerCase()+')').join(' vs '),ids:g.map(x=>x.id),a:'goVer',tab:'conflicts',label:'Open conflicts'});
  }
  for(const a of visibleAppts()){const d=until(a.date);if(d>=0&&d<=2&&!a.briefing&&!['Cancelled','Completed'].includes(a.status))out.push({p:2,title:'Prepare a briefing for '+a.customer,why:'Appointment '+(d===0?'today':d===1?'tomorrow':fmtD(a.date))+' at '+fmtT(a.time)+' with no briefing generated',a:'openAppt',id:a.id,label:'Open appointment'})}
  for(const it of attention()){
    if(it.kind==='Promotion ending')out.push({p:3,title:'Check whether '+subj(it.o)+' extends its '+it.o.field.toLowerCase()+' offer',why:it.text+'. It drops out of briefings after that date.',ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
    if(it.kind==='Expired')out.push({p:4,title:'Revalidate '+it.o.field.toLowerCase()+' for '+subj(it.o),why:it.text,ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
    if(it.kind==='Stale'&&it.o.category==='price')out.push({p:4,title:'Refresh the starting price for '+subj(it.o),why:it.text+'. Excluded from briefings until refreshed.',ids:[it.o.id],a:'openObs',id:it.o.id,label:'View evidence'});
  }
  for(const o of S.obs){if(!compArch(o.compId)&&o.verification==='Pending review'&&OFFICIAL.includes(o.sourceType)&&!c.conflict[o.id])out.push({p:3,title:'Verify '+o.field.toLowerCase()+': '+subj(o),why:SRC[o.sourceType]+' observation from '+rel(o.observed)+' is awaiting review',ids:[o.id],a:'openObs',id:o.id,label:'Review evidence'})}
  return out.sort((a,b)=>a.p-b.p).slice(0,6);
}

function mismatch(base,p){const m=[];if(base.type!==p.type)m.push(p.type+' vs '+base.type);if(Math.abs(base.lot-p.lot)>=5)m.push(p.lot+'′ vs '+base.lot+'′ lot');return m}
function cmpData(){
  const C=UI.cmp,base=S.empire.find(p=>p.id===C.base)||S.empire[0];
  let rows=[];
  for(const c of S.competitors){if(c.archived||(C.comp!=='all'&&c.id!==C.comp))continue;const ps=S.products.filter(p=>p.compId===c.id);if(!ps.length){if(C.showCand&&C.type==='all'&&C.minConf==='any'&&!C.hideUnlike)rows.push({c,p:null});continue}ps.forEach(p=>rows.push({c,p}))}
  rows=rows.filter(r=>{if(!r.p)return true;if(C.type!=='all'&&r.p.type!==C.type)return false;if(C.hideUnlike&&mismatch(base,r.p).length)return false;
    if(C.minConf!=='any'){const po=best(r.p.id,'Starting price');if(!po)return false;const lv=confidence(po).level;if(C.minConf==='High'&&lv!=='High')return false;if(C.minConf==='Medium'&&lv==='Low')return false}return true});
  const price=r=>{const o=r.p&&best(r.p.id,'Starting price');return o&&o.amount!=null?o.amount:Infinity};
  const lastV=r=>r.p?(S.obs.filter(o=>o.prodId===r.p.id&&o.verifiedOn).map(o=>o.verifiedOn).sort().pop()||''):'';
  const sorters={price:(a,b)=>price(a)-price(b),sqft:(a,b)=>((b.p&&b.p.sqft)||0)-((a.p&&a.p.sqft)||0),lot:(a,b)=>Math.abs(((a.p&&a.p.lot)||999)-base.lot)-Math.abs(((b.p&&b.p.lot)||999)-base.lot),verified:(a,b)=>lastV(b).localeCompare(lastV(a))};
  rows.sort((a,b)=>((!!b.p)-(!!a.p))||sorters[C.sort](a,b));
  return {base,rows,lastV};
}

function shopEvents(days,noExpiry){

  </div>
  <div class="df">${actionBtns(o,false)}</div>`;
}

/* ---------- briefing engine: rules over records, no AI ---------- */
function buildBriefing(a){
  const used=new Map(),use=o=>{if(o)used.set(o.id,o);return o?o.id:null};
  const B={summary:'',stated:[],empire:[],competitors:[],caution:[],incentives:[],market:[],questions:[],objections:[],talking:[],followups:[]};
  B.summary=`${a.customer}: ${a.household.toLowerCase()}, looking for a ${a.prefLot?a.prefLot+'′ ':''}${a.prefType.toLowerCase()} home with ${a.beds} bedrooms at ${a.community}. Budget ${money(a.budgetMin)}–${money(a.budgetMax)}, timeline ${a.timeline.toLowerCase()}. ${a.prevVisits?a.prevVisits+' previous visit'+(a.prevVisits>1?'s':'')+'.':'First appointment.'} Lead source: ${a.leadSource.toLowerCase()}.`;
  B.stated=[`Budget ${money(a.budgetMin)}–${money(a.budgetMax)}`,`${a.prefLot?a.prefLot+'′ ':''}${a.prefType}, ${a.beds} bedrooms`,`Timeline: ${a.timeline}`,`Lifestyle: ${a.lifestyle}`].concat(a.questions.map(q=>'Asked: '+q));
  const fit=[];
  S.empire.forEach(p=>{
    if(p.type===a.prefType){
      if(p.price<=a.budgetMax){fit.push(p);B.empire.push({t:`${p.name} from ${money(p.price)} is within budget${a.prefLot===p.lot?' and matches their lot interest':''} (demo price).`})}
      else B.empire.push({t:`${p.name} starts at ${money(p.price)}, ${money(p.price-a.budgetMax)} above the top of their budget${a.prefLot===p.lot?', though it matches their lot interest':''} (demo price).`});
    } else if(p.price<=a.budgetMax)B.empire.push({t:`${p.name} from ${money(p.price)} is within budget if they’re open to a ${p.type.toLowerCase()} (demo price).`});
  });
  if(!B.empire.length)B.empire.push({t:'No Empire product on file matches this type and budget. Confirm current availability with the sales office.'});
  const handled=new Set();
  S.products.filter(p=>!compArch(p.compId)&&p.type===a.prefType).forEach(p=>{
    const c=compById(p.compId),pr=best(p.id,'Starting price'),spec=`${p.lot}′, ${p.beds} bd, ${p.sqft.toLocaleString('en-CA')} sq ft`;
    if(quotable(pr)){
      const near=S.empire.filter(e=>e.type===p.type).sort((x,y)=>Math.abs(x.lot-p.lot)-Math.abs(y.lot-p.lot))[0];
      B.competitors.push({t:`${c.name}, ${p.name} (${spec}): ${pr.value}, verified ${fmtD(pr.verifiedOn)}${freshness(pr).k==='review'?', due for review':''}.${near?(Math.abs(near.lot-p.lot)>=5?' Lot width differs from '+near.name+'.':' Closest Empire match: '+near.name+'.'):''}`,ids:[use(pr)]});
    } else if(pr){const f=freshness(pr);B.caution.push({t:`${c.name}, ${p.name}: ${pr.value} is ${f.label.toLowerCase()} (${f.why.toLowerCase()}). Don’t quote it until it’s verified.`,ids:[use(pr)]})}
    else B.caution.push({t:`${c.name}, ${p.name}: no price on file.`});
    liveMulti(p.id,FIELDS.incentive).forEach(o=>{
      if(handled.has(o.id))return;
      const f=freshness(o);
      if(quotable(o)){B.incentives.push({t:`${c.name}, ${p.name}: ${o.value}${o.expires?', advertised until '+fmtD(o.expires):''}.`,ids:[use(o)]});return}
      const partners=(cx().conflict[o.id]||[]).map(obsById).filter(Boolean);
      partners.forEach(x=>handled.add(x.id));handled.add(o.id);
      B.caution.push({t:partners.length?`${c.name}, ${p.name}: ${o.field.toLowerCase()} reports are conflicting: ${[o].concat(partners).map(x=>x.value+' ('+SRC[x.sourceType].toLowerCase()+', '+x.verification.toLowerCase()+')').join(' vs ')}. Verify before discussing.`:`${c.name}, ${p.name}: ${o.value} is ${f.label.toLowerCase()} (${f.why.toLowerCase()}). Verify before discussing.`,ids:[use(o)].concat(partners.map(use))});
    });
  });
  B.market=shopEvents(30).filter(e=>e.usable&&e.matches.some(m=>m.x.apptId===a.id)).sort(ssSort).slice(0,4).map(e=>({t:e.title+'. '+(e.kind==='opportunity'?'Possible opportunity for Avalon.':'Threat '+e.score+' of 5.'),ids:[use(e.o)]}));
  const cands=S.competitors.filter(c=>!c.archived&&c.status==='candidate').length;
  if(cands)B.caution.push({t:`${cands} candidate builders near Avalon have no verified data. If the customer mentions one, log what they say as an observation rather than answering from memory.`});
  const L=a.lifestyle.toLowerCase();
  if(/commut|go train|transit/.test(L))B.questions.push('Which commute matters most, and at what times of day?');
  if(/school/.test(L)||/famil|child/.test(a.household.toLowerCase()))B.questions.push('Which schools or programs are on your list?');
  const over=S.empire.find(p=>p.type===a.prefType&&p.lot===a.prefLot&&p.price>a.budgetMax);
  if(over&&fit.length)B.questions.push(`Would a ${fit[0].lot}′ ${fit[0].type.toLowerCase()} work if it keeps you within budget, or is the ${a.prefLot}′ lot the priority?`);
  if(/month/.test(a.timeline.toLowerCase()))B.questions.push('Is your timeline tied to selling your current home?');
  B.questions.push('Which other communities are you considering, and what stood out there?');
  const kw=[[/decor/,'Decor credit'],[/deposit/,'Deposit structure'],[/closing/,'Closing costs'],[/price|square|sq/,'Starting price'],[/move|occupan/,'Occupancy'],[/appliance/,'Appliance package'],[/mortgage|rate/,'Mortgage promotion']];
  a.objections.forEach(txt=>{
    const m=kw.find(([r])=>r.test(txt.toLowerCase()));
    if(!m){B.objections.push({t:`“${txt}”: no matching records on file. Ask for specifics and log them.`});return}
    const found=S.obs.filter(o=>o.field===m[1]&&!compArch(o.compId)&&o.verification!=='Rejected'&&!cx().superseded.has(o.id));
    const ok=found.filter(quotable),bad=found.filter(o=>!quotable(o));
    B.objections.push({t:`“${txt}”: ${ok.length?ok.length+' verified '+m[1].toLowerCase()+' record'+(ok.length>1?'s':''):'no verified '+m[1].toLowerCase()+' records'} on file${bad.length?', plus '+bad.length+' unverified, stale or conflicting':''}. Ask which builder and exactly what was offered, then log it.`,ids:ok.concat(bad).map(use)});
  });
  fit.forEach(e=>{
    S.products.filter(p=>!compArch(p.compId)&&p.type===e.type&&Math.abs(p.lot-e.lot)<=4).forEach(p=>{
      const pr=best(p.id,'Starting price');if(!quotable(pr)||pr.amount==null)return;const c=compById(p.compId),d=pr.amount-e.price;
      if(d>0)B.talking.push({t:`${e.name} starts ${money(d)} below ${c.name}’s ${p.name} at a similar lot width (${p.lot}′). Lead with value on a like-for-like lot.`,ids:[use(pr)]});
      else if(d<0)B.talking.push({t:`${c.name}’s ${p.name} starts ${money(-d)} lower than ${e.name} at a similar lot width. Be ready to walk through what’s included rather than meeting on price.`,ids:[use(pr)]});
    });
  });
  if(a.questions.some(q=>/appliance/i.test(q))){const e=fit.find(x=>/appliance/i.test(x.incentive));B.talking.push({t:e?`They asked about appliances. ${e.name} lists: ${e.incentive} (demo).`:`They asked about appliances. Confirm what’s included with ${fit.length?fit[0].name:'the homes they like'} before the appointment.`})}
  if(!B.talking.length)B.talking.push({t:'No verified like-for-like comparison is available yet. Focus on discovery and log what they share about other builders.'});
  if(B.caution.some(x=>/conflicting/.test(x.t)))B.followups.push(`Ask a reviewer to resolve the conflicting incentive reports before ${a.date===TODAY?'the appointment':fmtD(a.date)}.`);
  if(fit.length)B.followups.push(`Send floorplans for ${fit.map(f=>f.name).join(' and ')}.`);
  B.followups.push('Record the outcome, and log any competitor offers they mention as observations.');
  const sources=[...used.values()].map(o=>({id:o.id,label:subj(o)+', '+o.field,value:o.value,src:SRC[o.sourceType],ref:o.sourceRef,obs:o.observed,conf:confidence(o).level,fresh:freshness(o).label}));
  return {at:new Date().toISOString(),by:me().name,B,sources};
}

function syncObsForm(){

  const fs=md.querySelector('#obsField'),prevF=fs.value;fs.innerHTML=FIELDS[cat].map(f=>`<option ${f===prevF?'selected':''}>${f}</option>`).join('');

/* ---------- mutations ---------- */
function setVer(o,status,note){
  o.verification=status;
  if(status==='Verified'){o.reviewer=me().name;o.verifiedOn=TODAY;o.markedStale=false;if(!o.revalidateBy||until(o.revalidateBy)<0)o.revalidateBy=dOff(30)}
  o.history.push({at:TODAY,by:me().name,action:status==='More info required'?'Requested more evidence':status,note:note||''});
  audit(`${status==='Verified'?'Approved':status==='Rejected'?'Rejected':'Requested evidence for'} ${o.id} (${subj(o)}, ${o.field})`);save();
}
function printHTML(title,html){
  const r=document.getElementById('print-root');r.innerHTML=`<h1>${esc(title)}</h1><p>Empire Sales Intelligence, printed ${fmtD(TODAY)}. Records marked Demo are fictional.</p>`+html;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  try{window.print()}catch(e){done();toast('Printing isn’t available in this view. Use Export instead.',true)}
  setTimeout(done,1500);
}
function cmpCSV(){
  const {base,rows}=cmpData(),sel=UI.cmp.sel.filter(id=>prodById(id));
  const pick=sel.length?rows.filter(r=>r.p&&sel.includes(r.p.id)):rows;
  const out=[['Data label','Builder','Community','Product','Type','Lot width (ft)','Beds','Baths','Sq ft','Starting price (CAD)','Price record','Price source','Price observed','Price confidence','Price freshness','Incentives','Deposit','Occupancy','Comparison flag']];
  out.push(['DEMO','Empire Communities','Avalon',base.name,base.type,base.lot,base.beds,base.baths,base.sqft,base.price,'','Empire product data (demo)','','','',base.incentive,base.deposit,base.occupancy,'Baseline']);
  pick.forEach(({c,p})=>{
    if(!p){out.push([c.demo?'DEMO':'Not verified',c.name,c.community,'','','','','','','Not verified','','','','','','Not verified','Not verified','Not verified','No data on file']);return}
    const pr=best(p.id,'Starting price'),inc=liveMulti(p.id,FIELDS.incentive),dep=best(p.id,'Deposit structure'),occ=best(p.id,'Occupancy');
    out.push([c.demo?'DEMO':'',c.name,c.community,p.name,p.type,p.lot,p.beds,p.baths,p.sqft,pr&&pr.amount!=null?pr.amount:'Not verified',pr?pr.id:'',pr?SRC[pr.sourceType]+': '+(pr.sourceRef||'no reference'):'',pr?pr.observed:'',pr?confidence(pr).level:'',pr?freshness(pr).label:'',inc.map(o=>o.value+' ('+freshness(o).label+')').join('; ')||'Not verified',dep?dep.value+' ('+freshness(dep).label+')':'Not verified',occ?occ.value+' ('+freshness(occ).label+')':'Not verified',mismatch(base,p).join('; ')]);
  });
  return toCSV(out);
}

  ssTask(d){const e=shopEvents(90).find(x=>x.id===d.ev),rec=apptById(d.pid)||(S.prospects||[]).find(p=>p.id===d.pid);if(!rec)return;rec.tasks=rec.tasks||[];if(rec.tasks.some(t=>t.ev===d.ev))return;rec.tasks.push({text:'Follow up: '+(e?e.title:'competitor change'),due:TODAY,done:false,ev:d.ev});const nm=rec.customer||rec.name;audit('Added follow-up for '+nm+' from Secret Shopper');save();toast('Follow-up added for '+nm);render()},
  exportShop(d){const c=compById(d.id);offerFile('secret-shop-'+slug(c.name)+'-'+TODAY+'.md',shopMD(d.id))},
  printShop(){const r=document.getElementById('shop-report');printHTML('Secret shop',r?r.innerHTML:'')},
  removeDemo(){confirmBox('Remove demo records','This removes every record marked Demo: fictional builders, products, observations and customers. Candidate builders and anything you added stay.','Remove demo records',()=>{const dc=new Set(S.competitors.filter(c=>c.demo).map(c=>c.id));S.competitors=S.competitors.filter(c=>!c.demo);S.products=S.products.filter(p=>!p.demo&&!dc.has(p.compId));S.obs=S.obs.filter(o=>!o.demo&&!dc.has(o.compId));S.appts=S.appts.filter(a=>!a.demo);S.prospects=(S.prospects||[]).filter(p=>!p.demo);UI.cmp.sel=[];audit('Removed demo records');save();toast('Demo records removed')},true)},
  resetDemo(){confirmBox('Reset demo','This restores the original demo data and discards every change made in this browser.','Reset',()=>{S=seed();UI.cmp.sel=[];UI.stack=[];save();toast('Demo data reset')},true)}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(UI.pop&&!e.target.closest('.pop')){UI.pop=null;renderTop()}if(!e.target.closest('.search')){const b=document.getElementById('sres');b&&(b.innerHTML='')}return}
  if(t.disabled)return;const fn=A[t.dataset.a];if(fn)fn(t.dataset,t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(UI.modal){A.closeModal()}else if(UI.stack.length){UI.stack.pop();renderLayer()}else if(UI.pop){UI.pop=null;renderTop()}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='ssq'){A.ssShop();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-a]')){const fn=A[e.target.dataset.a];fn&&fn(e.target.dataset,e.target,e)}
});
const F={range:v=>UI.range=+v,actComp:v=>UI.actComp=v,role:v=>{UI.role=v;saveUI();UI.stack=[];UI.appt.consultant='all';toast('Viewing as '+ROLES[v].name+', '+v)},dirq:v=>UI.dir.q=v,dirStatus:v=>UI.dir.status=v,
  cmpBase:v=>UI.cmp.base=v,cmpComp:v=>UI.cmp.comp=v,cmpType:v=>UI.cmp.type=v,cmpConf:v=>UI.cmp.minConf=v,cmpSort:v=>UI.cmp.sort=v,verq:v=>UI.ver.q=v,apptq:v=>UI.appt.q=v,apptCons:v=>UI.appt.consultant=v,apptDate:v=>{if(v){UI.appt.view='date';UI.appt.date=v}},
  ssWin:v=>UI.ss.win=+v,ssCardSel:v=>UI.ss.card=v,ssWcComp:v=>UI.ss.wcComp=v,ssWcMin:v=>UI.ss.wcMin=v,ssq:v=>UI.ss.q=v};
const FB={dirArch:c=>UI.dir.archived=c,cmpUnlike:c=>UI.cmp.hideUnlike=c,cmpCand:c=>UI.cmp.showCand=c};
function onField(e){
  const t=e.target;if(!t||!t.closest)return;
  if(t.id==='gsearch'){UI.gq=t.value;renderSearch();return}
  if(t.closest('.modal')){if(t.hasAttribute('data-sync'))syncObsForm();return}
  const k=t.dataset&&t.dataset.f;if(!k)return;
  if(FB[k]){if(e.type==='change'){FB[k](t.checked);render()}return}
  if(F[k]){const isText=t.type==='search'||t.type==='text';if(isText!==(e.type==='input'))return;F[k](t.value);render()}
}
document.addEventListener('input',onField);document.addEventListener('change',onField);

render();
})();
</script>
</body>
